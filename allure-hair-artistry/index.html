<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allure Hair Artistry — Logansport, IN — Hair Salon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;background:#141216;color:#efe7ea;line-height:1.7}
.banner{display:none;background:#c98a94;color:#141216;text-align:center;padding:.8rem 1rem;font-weight:700;letter-spacing:.03em}
header{text-align:center;padding:3rem 1.2rem 2rem}
.orn{color:#c98a94;letter-spacing:.6em;font-size:.85rem;margin-bottom:1rem}
h1{font-size:clamp(2.1rem,7vw,3.2rem);color:#f7eef1;font-weight:400;line-height:1.15}
.rule{width:64px;height:2px;background:#c98a94;margin:1.2rem auto}
.tag{font-style:italic;color:#a89aa0;font-size:1.08rem}
.contact{text-align:center;padding:0 1.2rem 2.2rem}
.contact .addr{color:#a89aa0;margin-bottom:1.1rem}
.contact a{display:inline-block;min-height:48px;line-height:48px;padding:0 1.6rem;margin:.3rem;border-radius:999px;text-decoration:none;font-weight:700}
.contact .call{background:#c98a94;color:#141216}
.contact .dir{border:1px solid #c98a94;color:#c98a94}
.contact .fb{border:1px solid #a89aa0;color:#a89aa0;display:none}
main{max-width:680px;margin:0 auto;padding:0 1.2rem 3rem}
.block{margin-bottom:2.8rem;text-align:center}
h2{color:#f7eef1;font-size:1.15rem;letter-spacing:.28em;text-transform:uppercase;margin-bottom:1.2rem}
h2::after{content:'';display:block;width:44px;height:1px;background:#c98a94;margin:.7rem auto 0}
.special{border:1px solid #c98a94;border-radius:4px;padding:1rem;margin:0 auto 1rem;max-width:520px}
.special b{display:block;color:#f7eef1;font-size:1.08rem}
.special span{color:#a89aa0;font-size:.95rem}
.item{padding:.7rem 0;border-bottom:1px solid #3a3238;max-width:520px;margin:0 auto}
.item .n{font-weight:700;color:#f7eef1}
.item .n small{display:block;font-weight:400;color:#a89aa0;font-size:.87rem}
.item .p{color:#c98a94;font-weight:700}
.hours{max-width:440px;margin:0 auto}
.hrow{display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid #3a3238}
.hrow span:last-child{color:#f7eef1;font-weight:700}
footer{text-align:center;padding:1.8rem;color:#a89aa0;font-size:.85rem}
.loading{text-align:center;padding:4rem 1rem;color:#a89aa0}

.biz-logo{display:block;margin:0 auto .7rem;max-height:104px;width:auto;max-width:72%;border-radius:10px}
.hero-photo{display:block;margin:0 auto 1rem;max-height:230px;width:auto;max-width:88%;border-radius:12px}
.photos{max-width:760px;margin:0 auto 2.4rem;padding:0 1.2rem}
.photos h2{font-size:1.35rem;margin-bottom:.8rem}
.photo-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
.photo-strip img{width:100%;height:165px;object-fit:cover;border-radius:10px;display:block}
</style>
<!--kb-packs-->
<style>
/* Kyle Berry site enhancement packs: a11y + reveal + responsive */
/* Pack A — accessibility guardrails (injected into every concept site) */

/* Visible keyboard focus everywhere */
:focus-visible { outline: 3px solid #4d9fff; outline-offset: 2px; border-radius: 4px; }

/* Text over imagery: scrim shadow so words survive any background.
   Applied to reading text only — buttons keep their designed surfaces. */
.hero h1, .hero h2, .hero h3, .hero p, .hero li,
[class*="hero"] h1, [class*="hero"] h2, [class*="hero"] h3, [class*="hero"] p, [class*="hero"] li,
.banner h1, .banner h2, .banner h3, .banner p,
[class*="banner"] h1, [class*="banner"] h2, [class*="banner"] h3, [class*="banner"] p,
figcaption {
  text-shadow: 0 1px 3px rgba(0,0,0,.55), 0 2px 14px rgba(0,0,0,.35);
}

/* Long words never break layouts on narrow screens */
p, li, h1, h2, h3 { overflow-wrap: break-word; }

/* Motion respects the visitor */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Pack B — scrollytelling reveal (injected into every concept site) */
/* Hidden states only apply when JS is running (html.js), so no-JS visitors see everything. */
html.js .rv { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
html.js .rv.in { opacity: 1; transform: none; }
/* Specials / offers get a little extra pop */
html.js .rv-pop { opacity: 0; transform: translateY(26px) scale(.96); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
html.js .rv-pop.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html.js .rv, html.js .rv-pop { opacity: 1; transform: none; transition: none; }
}

/* Pack C — desktop/mobile differentiation (injected into every concept site) */

/* Mobile: roomy tap targets on anything that looks like a call-to-action */
@media (max-width: 720px) {
  .btn, .button, a[class*="btn"], a[class*="button"], button {
    min-height: 48px;
  }
  /* Sticky tap-to-call bar (created by pack-reveal.js); mobile only */
  .kb-callbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center; gap: .5rem;
    padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    font: 700 1.05rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-decoration: none; color: #fff; background: #1d7a3d;
    box-shadow: 0 -4px 18px rgba(0,0,0,.25);
  }
  body.kb-has-callbar { padding-bottom: 76px; }
}
@media (min-width: 721px) {
  .kb-callbar { display: none; }
}

</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header>
<div class="orn">✦ ✦ ✦</div>
<h1 id="biz-name">…</h1>
<div class="rule"></div>
<div class="tag" id="biz-tag"></div>
</header>
<div class="contact">
<div class="addr" id="biz-addr"></div>
<a class="call" id="biz-phone" href="#" style="display:none">Call</a>
<a class="dir" id="biz-dir" href="#">Directions</a>
<a class="fb" id="fb-link" href="#">Facebook</a>
</div>
<main id="content"><div class="loading">Loading…</div></main>

<section class="photos" aria-label="Our work">
<h2>Our work</h2>
<div class="photo-strip">
<img src="../assets/allure-hair-artistry/allure-hair-artistry-profile.jpg" alt="Allure Hair Artistry stylist in a branded tee" loading="lazy"><img src="../assets/allure-hair-artistry/allure-hair-artistry-1.jpg" alt="Eyelash extension work by Allure Hair Artistry" loading="lazy"><img src="../assets/allure-hair-artistry/allure-hair-artistry-2.jpg" alt="The Allure Hair Artistry team" loading="lazy">
</div>
</section>
<footer><span id="foot-name"></span><br><span id="foot-addr"></span></footer>
<script>

fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.title = b.name + ' — ' + c.meta.townTrade;
    set('biz-name', b.name); set('biz-tag', b.tagline);
    set('biz-addr', b.address);
    const ph = document.getElementById('biz-phone');
    if (b.phone) { ph.textContent = b.phone; ph.href = 'tel:+1' + b.phone.replace(/\D/g, ''); ph.style.display = ''; }
    const dl = document.getElementById('biz-dir');
    if (dl && b.address) dl.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.name + ' ' + b.address);
    const fb = document.getElementById('fb-link');
    if (fb && b.facebook) { fb.href = b.facebook; fb.style.display = ''; }
    const an = document.getElementById('banner');
    if (c.announcement) { an.textContent = c.announcement; an.style.display = 'block'; }
    let h = '';
    if (c.specials && c.specials.length) {
      h += '<section class="block"><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b>' + (s.desc ? '<span>' + esc(s.desc) + '</span>' : '') + '</div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section class="block"><h2>' + esc(sec.section) + '</h2>' +
        (sec.items || []).map(it =>
          '<div class="item"><div class="n">' + esc(it.name) +
          (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</div>' +
          (it.price ? '<div class="p">' + esc(it.price) + '</div>' : '') + '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section class="block"><h2>Hours</h2><div class="hours">' + c.hours.map(x =>
        '<div class="hrow"><span>' + esc(x.days) + '</span><span>' + esc(x.time) + '</span></div>').join('') + '</div></section>';
    }
    document.getElementById('content').innerHTML = h;
    document.getElementById('foot-name').textContent = b.name || '';
    document.getElementById('foot-addr').textContent = b.address || '';
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function set(id, v) { const e = document.getElementById(id); if (e && v) e.textContent = v; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

</script>
<!--kb-packs-->
<script>
/* Pack B+C runtime: scrollytelling reveals + mobile call bar.
   Runs after parse; content stays visible if this never executes. */
(function () {
  document.documentElement.classList.add('js');

  function onReady() {
    /* ---- scrollytelling: fade/slide sections in as they enter ---- */
    var special = /special|offer|deal|\bsale\b|limited|coupon|discount|save\b/i;
    var sections = document.querySelectorAll('body > section, body > main > section, body > main > div > section');
    var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' }) : null;

    sections.forEach(function (sec) {
      if (sec.classList.contains('rv') || sec.classList.contains('rv-pop')) return;
      var pop = special.test(sec.textContent || '');
      sec.classList.add(pop ? 'rv-pop' : 'rv');
      if (io) io.observe(sec);
      else sec.classList.add('in');
    });

    /* ---- mobile differentiation: sticky tap-to-call bar ---- */
    try {
      var tel = document.querySelector('a[href^="tel:"]');
      var already = document.querySelector('.kb-callbar, [class*="sticky-call"], [class*="call-bar"]');
      if (tel && !already) {
        var name = (document.querySelector('h1') || {}).textContent || 'us';
        name = name.trim().split('\n')[0].slice(0, 34);
        var bar = document.createElement('a');
        bar.className = 'kb-callbar';
        bar.href = tel.getAttribute('href');
        bar.textContent = '\uD83D\uDCDE Call ' + name;
        document.body.appendChild(bar);
        document.body.classList.add('kb-has-callbar');
      }
    } catch (err) { /* never break the page for a call bar */ }
  }

  if (document.readyState !== 'loading') onReady();
  else document.addEventListener('DOMContentLoaded', onReady);
})();

</script>
</body>
</html>
