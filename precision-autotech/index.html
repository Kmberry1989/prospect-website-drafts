<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f2a43">
<link rel="icon" href="data:,">
<title>Precision AutoTech LLC — Peru, IN | ASE Master Technician Auto Repair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0f2a43;
    --navy-2: #163a5c;
    --steel: #5b7a99;
    --accent: #2fbf9b;
    --paper: #f2f5f7;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5c6f82;
    --line: #d9e2ea;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.6; font-size: 17px; }
  a { color: inherit; }
  .topline { height: 6px; background: linear-gradient(90deg, var(--accent), var(--steel), var(--accent)); }
  .banner { background: var(--accent); color: #06231b; text-align: center; padding: 0.75rem 1rem; font-weight: 700; font-family: var(--mono); font-size: 0.95rem; display: none; }
  header { background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff; padding: 2.6rem 1.25rem 2.2rem; text-align: center; }
  header .mono-kicker { font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.7rem; }
  header h1 { font-weight: 700; font-size: clamp(2rem, 7.5vw, 2.9rem); line-height: 1.1; letter-spacing: -0.01em; }
  header .tag { margin: 1rem auto 0; max-width: 36ch; font-family: var(--mono); font-size: 1.02rem; color: var(--accent); border: 1px solid rgba(47,191,155,.45); border-radius: 8px; padding: 0.7rem 1rem; background: rgba(0,0,0,.25); }
  header .ase { margin-top: 1rem; font-family: var(--mono); font-size: 0.82rem; color: #a9c3d8; letter-spacing: 0.06em; }
  .cta { display: grid; gap: 0.7rem; max-width: 520px; margin: 0 auto; padding: 1.5rem 1.25rem 0; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 58px; padding: 0.85rem 1.4rem; border-radius: 8px; font-weight: 700; font-size: 1.1rem; text-decoration: none; font-family: var(--mono); }
  .btn.primary { background: var(--accent); color: #06231b; }
  .btn.secondary { background: var(--card); color: var(--navy); border: 2px solid var(--navy); }
  .btn:active { transform: translateY(1px); }
  main { max-width: 720px; margin: 0 auto; padding: 1.6rem 1.25rem 2.5rem; }
  section { margin-bottom: 2.2rem; }
  h2 { font-family: var(--mono); font-weight: 600; font-size: 0.95rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--steel); margin-bottom: 0.9rem; }
  .special { background: #e7f8f2; border: 1px solid var(--accent); border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 0.9rem; }
  .special b { display: block; font-size: 1.05rem; }
  .special span { color: var(--muted); font-size: 0.93rem; }
  .svc { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem 1.05rem; margin-bottom: 0.65rem; display: flex; align-items: baseline; gap: 0.8rem; }
  .svc .code { font-family: var(--mono); font-size: 0.78rem; color: var(--steel); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 0.2rem 0.5rem; flex: none; }
  .svc .n { font-weight: 600; }
  .svc .n small { display: block; font-weight: 400; color: var(--muted); font-size: 0.88rem; }
  .hours { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .hours td { padding: 0.75rem 1.05rem; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 0.95rem; }
  .hours tr:last-child td { border-bottom: none; }
  .hours td:last-child { text-align: right; font-weight: 600; color: var(--navy); }
  .visit { background: var(--navy); color: #d9e6f2; border-radius: 12px; padding: 1.4rem; }
  .visit p { margin-bottom: 0.5rem; font-family: var(--mono); font-size: 0.95rem; }
  .visit a { color: var(--accent); font-weight: 600; }
  footer { text-align: center; padding: 1.6rem 1rem 2.4rem; color: var(--muted); font-size: 0.85rem; font-family: var(--mono); }
  .loading { text-align: center; padding: 4rem 1rem; color: var(--muted); font-family: var(--mono); }
</style>
<!--kb-packs-->
<style>
/* Kyle Berry site enhancement packs: a11y + reveal + responsive + mini-nav */
/* Pack A — accessibility guardrails (injected into every concept site) */

/* Visible keyboard focus everywhere */
:focus-visible { outline: 3px solid #4d9fff; outline-offset: 2px; border-radius: 4px; }

/* Text over imagery: scrim shadow so words survive any background.
   Applied to reading text only — buttons keep their designed surfaces. */
.hero h1, .hero h2, .hero h3, .hero p, .hero li,
[class*="hero"] h1, [class*="hero"] h2, [class*="hero"] h3, [class*="hero"] p, [class*="hero"] li,
.banner h1, .banner h2, .banner h3, .banner p,
[class*="banner"] h1, [class*="banner"] h2, [class*="banner"] h3, [class*="banner"] p,
figcaption {
  text-shadow: 0 1px 3px rgba(0,0,0,.55), 0 2px 14px rgba(0,0,0,.35);
}

/* Headlines, titles, and subtitles always carry a legibility shadow, so
   they survive stripes, patterns, and busy backgrounds — never bare text
   on a busy surface. Site-specific headline shadows still win. */
h1, h2, h3, h4, h5, h6,
.sub, .subtitle, .tagline, .kicker,
.section-title, .sec-title, .sec-head {
  text-shadow: 0 1px 2px rgba(0,0,0,.30), 0 1px 10px rgba(0,0,0,.20);
}

/* Long words never break layouts on narrow screens */
p, li, h1, h2, h3 { overflow-wrap: break-word; }

/* Header logos: consistent, scalable, never oversized on phones */
.biz-logo { max-height: 104px; width: auto; max-width: 72%; }
@media (max-width: 720px) {
  .biz-logo { max-height: 80px; }
}

/* Motion respects the visitor */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Pack B — scrollytelling reveal (injected into every concept site) */
/* Hidden states only apply when JS is running (html.js), so no-JS visitors see everything. */
html.js .rv { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
html.js .rv.in { opacity: 1; transform: none; }
/* Specials / offers get a little extra pop */
html.js .rv-pop { opacity: 0; transform: translateY(26px) scale(.96); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
html.js .rv-pop.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html.js .rv, html.js .rv-pop { opacity: 1; transform: none; transition: none; }
}

/* Pack C — desktop/mobile differentiation (injected into every concept site) */

/* Mobile: roomy tap targets on anything that looks like a call-to-action */
@media (max-width: 720px) {
  .btn, .button, a[class*="btn"], a[class*="button"], button {
    min-height: 48px;
  }
  /* Sticky tap-to-call bar (created by pack-reveal.js); mobile only */
  .kb-callbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center; gap: .5rem;
    padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    font: 700 1.05rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-decoration: none; color: #fff; background: #1d7a3d;
    box-shadow: 0 -4px 18px rgba(0,0,0,.25);
  }
  body.kb-has-callbar { padding-bottom: 76px; }
}
@media (min-width: 721px) {
  .kb-callbar { display: none; }
}

/* Pack D — slim sticky mini-nav (auto-built by pack-enhance.js).
   Only used on pages with no <nav> of their own. Slides in after scrolling
   past the hero. Never a hamburger — these are single-page local sites. */
.kb-mininav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 70;
  display: flex; align-items: center; gap: .8rem;
  padding: .55rem 1rem;
  background: rgba(12,16,22,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: #fff;
  font: 600 .85rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  border-bottom: 1px solid rgba(255,255,255,.12);
  transform: translateY(-110%); transition: transform .35s ease;
}
.kb-mininav.on { transform: none; }
.kb-mn-name { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }
.kb-mn-links { display: flex; gap: .1rem; overflow-x: auto; margin-left: auto; scrollbar-width: none; }
.kb-mn-links::-webkit-scrollbar { display: none; }
.kb-mn-links a { color: #cfd6e4; text-decoration: none; padding: .55rem .6rem; border-radius: 8px; white-space: nowrap; }
.kb-mn-links a:hover { color: #fff; background: rgba(255,255,255,.1); }
.kb-mn-call {
  margin-left: auto; background: #1d7a3d; color: #fff; text-decoration: none; font-weight: 800;
  padding: .65rem 1rem; border-radius: 999px; white-space: nowrap; min-height: 44px;
  display: inline-flex; align-items: center;
}
/* Anchor targets clear the fixed bar */
section[id] { scroll-margin-top: 64px; }
@media (max-width: 720px) {
  .kb-mn-links { display: none; }
  .kb-mn-name { max-width: 52vw; }
}
@media (prefers-reduced-motion: reduce) {
  .kb-mininav { transition: none; }
}

</style>
</head>
<body>
<div class="topline" aria-hidden="true"></div>
<div class="banner" id="banner"></div>
<header>
  <div class="mono-kicker">Peru, Indiana</div>
  <h1 id="biz-name">…</h1>
  <div class="tag" id="biz-tag"></div>
  <div class="ase">ASE CERTIFIED MASTER TECHNICIAN</div>
</header>
<div class="cta">
  <a class="btn primary" id="call-btn" href="#">Call for an Appointment</a>
  <a class="btn secondary" id="dir-btn" href="#" target="_blank" rel="noopener">Get Directions</a>
</div>
<main id="content"><div class="loading">loading…</div></main>
<footer><span id="foot-name"></span> · content managed with sitekeeper</footer>
<div class="topline" aria-hidden="true"></div>
<script>
fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.title = b.name + ' — Peru, IN | ASE Master Technician Auto Repair';
    document.getElementById('biz-name').textContent = b.name;
    document.getElementById('biz-tag').textContent = b.tagline || '';
    document.getElementById('foot-name').textContent = b.name || '';
    const banner = document.getElementById('banner');
    if (c.announcement) { banner.textContent = c.announcement; banner.style.display = 'block'; }
    const tel = 'tel:' + String(b.phone || '').replace(/\D/g, '');
    const callBtn = document.getElementById('call-btn');
    callBtn.href = tel;
    callBtn.textContent = 'Call ' + (b.phone || 'for an Appointment');
    const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.address || b.name);
    document.getElementById('dir-btn').href = mapsUrl;
    let h = '';
    if (c.specials && c.specials.length) {
      h += '<section><h2>// Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b><span>' + esc(s.desc) + '</span></div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section><h2>// ' + esc(sec.section) + '</h2>' + (sec.items || []).map((it, i) =>
        '<div class="svc"><span class="code">SVC-' + String(i + 1).padStart(2, '0') + '</span><div class="n">' + esc(it.name) +
        (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</div></div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section><h2>// Hours</h2><table class="hours">' + c.hours.map(x =>
        '<tr><td>' + esc(x.days) + '</td><td>' + esc(x.time) + '</td></tr>').join('') + '</table></section>';
    }
    h += '<section><h2>// Find Us</h2><div class="visit"><p>' + esc(b.address || '') + '</p>' +
      '<p>tel &gt; <a href="' + tel + '">' + esc(b.phone || '') + '</a></p>' +
      '<p><a href="' + mapsUrl + '" target="_blank" rel="noopener">open in google maps &#8599;</a></p></div></section>';
    document.getElementById('content').innerHTML = h;
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">could not load content.</div>'; });
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
<!--kb-packs-->
<script>
/* Site enhancement packs runtime: scrollytelling reveals + mobile call bar + mini-nav.
   Runs after parse; content stays visible if this never executes.
   Handles fetch-rendered content (content.json) via MutationObserver. */
(function () {
  document.documentElement.classList.add('js');

  var SPECIAL = /special|offer|deal|\bsale\b|limited|coupon|discount|\bsave\b/i;

  function slug(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'section';
  }

  function sections() {
    // avoid double-counting sections inside main
    var seen = new Set(), out = [];
    document.querySelectorAll('main section, body > section').forEach(function (sec) {
      if (seen.has(sec)) return; seen.add(sec); out.push(sec);
    });
    return out;
  }

  function labelFor(sec) {
    var l = sec.getAttribute('aria-label') || '';
    if (!l) {
      var h = sec.querySelector('h1,h2');
      l = h ? h.textContent : '';
    }
    return (l || '').trim().split('\n')[0].slice(0, 30);
  }

  function enhance() {
    /* ---- scrollytelling: fade/slide sections in as they enter ---- */
    var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' }) : null;

    sections().forEach(function (sec) {
      if (sec.dataset.kbRv) return; sec.dataset.kbRv = '1';
      var pop = SPECIAL.test(sec.textContent || '');
      sec.classList.add(pop ? 'rv-pop' : 'rv');
      if (io) io.observe(sec); else sec.classList.add('in');
    });

    buildMiniNav();
  }

  var navBuilt = false;
  function buildMiniNav() {
    if (navBuilt || document.querySelector('nav') || document.querySelector('.kb-mininav')) return;
    var items = [];
    sections().forEach(function (sec) {
      var label = labelFor(sec);
      if (!label || items.length >= 6) return;
      if (!sec.id) sec.id = 'kb-' + slug(label);
      items.push({ id: sec.id, label: label });
    });
    if (items.length < 2) return;
    navBuilt = true;

    var name = (document.title || '').split(/[|–—\-]/)[0].trim();
    if (!name) {
      var h1 = document.querySelector('h1');
      name = h1 ? h1.textContent.trim().split('\n')[0].slice(0, 34) : 'Home';
    }
    var tel = document.querySelector('a[href^="tel:"]');

    var bar = document.createElement('div');
    bar.className = 'kb-mininav';
    bar.setAttribute('role', 'navigation');
    bar.setAttribute('aria-label', 'Page sections');
    var html = '<span class="kb-mn-name"></span><span class="kb-mn-links">' +
      items.map(function (it) { return '<a href="#' + it.id + '"></a>'; }).join('') +
      '</span>';
    if (tel) html += '<a class="kb-mn-call" href="' + tel.getAttribute('href') + '">\uD83D\uDCDE Call</a>';
    bar.innerHTML = html;
    bar.querySelector('.kb-mn-name').textContent = name;
    var links = bar.querySelectorAll('.kb-mn-links a');
    items.forEach(function (it, i) { links[i].textContent = it.label; });
    document.body.appendChild(bar);

    var navThreshold = function () {
      var scrollable = document.documentElement.scrollHeight - window.innerHeight;
      return Math.min(480, Math.max(120, scrollable * 0.35));
    };
    var onScroll = function () { bar.classList.toggle('on', window.scrollY > navThreshold()); };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  /* ---- mobile differentiation: sticky tap-to-call bar ---- */
  function callBar() {
    if (document.querySelector('.kb-callbar')) return;
    try {
      var tel = document.querySelector('a[href^="tel:"]');
      var already = document.querySelector('[class*="sticky-call"], [class*="call-bar"]');
      if (tel && !already) {
        var h1 = document.querySelector('h1');
        var name = h1 ? h1.textContent.trim().split('\n')[0].slice(0, 34) : 'us';
        var bar = document.createElement('a');
        bar.className = 'kb-callbar';
        bar.href = tel.getAttribute('href');
        bar.textContent = '\uD83D\uDCDE Call ' + name;
        document.body.appendChild(bar);
        document.body.classList.add('kb-has-callbar');
      }
    } catch (err) { /* never break the page for a call bar */ }
  }

  function onReady() {
    enhance();
    callBar();
    // Catch fetch-rendered sections (content.json sites)
    if ('MutationObserver' in window) {
      var deb = null;
      new MutationObserver(function () {
        clearTimeout(deb);
        deb = setTimeout(function () { enhance(); callBar(); }, 600);
      }).observe(document.body, { childList: true, subtree: true });
    } else {
      setTimeout(function () { enhance(); callBar(); }, 2000);
    }
    // One last pass in case rendering was slow
    setTimeout(function () { enhance(); callBar(); }, 4000);
  }

  if (document.readyState !== 'loading') onReady();
  else document.addEventListener('DOMContentLoaded', onReady);
})();

</script>
</body>
</html>
