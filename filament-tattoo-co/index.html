<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filament Tattoo Co. | Tattoo & Piercing in Wabash, IN</title>
<meta name="description" content="Filament Tattoo Co. — tattoo and piercing in Wabash, IN. Clean shop, friendly crew. Call (260) 274-0999.">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.65; color: #eef1f6; background: #0b0f16; }
.banner { display: none; text-align: center; padding: 0.8rem 1rem; font-weight: 700; background: #ffb347; color: #0b0f16; }
.hero { text-align: center; padding: 3rem 1.2rem 2.2rem; background: radial-gradient(ellipse 60% 45% at 50% 30%, rgba(255,179,71,0.22) 0%, #0b0f16 70%); border-bottom: 3px solid #ffb347; }
.hero h1 { font-family: "Trebuchet MS", Verdana, sans-serif; font-size: clamp(2.1rem, 8vw, 3.2rem); color: #ffffff; line-height: 1.15; margin: 0.6rem 0 0.4rem; }
.tag { font-size: 1.08rem; color: #ffd9a0; letter-spacing: 0.04em; }
.contact-bar { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; padding: 0 1.2rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; min-width: 160px; padding: 0.7rem 1.4rem; font-size: 1.05rem; font-weight: 700; text-decoration: none; border-radius: 999px; .btn.call { background: #ffb347; color: #0b0f16; border: 2px solid #ffb347; box-shadow: 0 0 18px rgba(255,179,71,0.35); } .btn.dir { background: transparent; color: #ffb347; border: 2px solid #ffb347; } }
.addr { text-align: center; padding: 0.9rem 1.2rem 0.4rem; color: #c7cdd8; font-size: 0.98rem; }
main { max-width: 760px; margin: 0 auto; padding: 1.6rem 1.2rem 3rem; }
section { margin-bottom: 2.4rem; }
section h2 { font-family: "Trebuchet MS", Verdana, sans-serif; font-size: 1.5rem; color: #ffb347; margin-bottom: 0.9rem; border-bottom: 2px solid #3a2a18; padding-bottom: 0.35rem; letter-spacing: 0.03em; }
.special { background: #141a26; border: 1px solid #ffb347; border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.8rem; color: #eef1f6; box-shadow: 0 0 14px rgba(255,179,71,0.12); }
.special b { display: block; font-size: 1.05rem; }
.special span { font-size: 0.96rem; }
.item { display: flex; justify-content: space-between; gap: 1rem; padding: 0.65rem 0; border-bottom: 1px dotted #2a3345; }
.item .n { font-weight: 700; font-size: 1.02rem; }
.item .n small { display: block; font-weight: 400; font-size: 0.9rem; color: #aab3c2; margin-top: 0.15rem; }
.item .p { font-weight: 700; white-space: nowrap; color: #ffb347; }
.hours { width: 100%; border-collapse: collapse; }
.hours td { padding: 0.55rem 0; border-bottom: 1px dotted #2a3345; }
.hours td:last-child { text-align: right; font-weight: 700; }
footer { text-align: center; padding: 1.6rem 1.2rem 2.2rem; font-size: 0.88rem; color: #77808f; border-top: 1px solid #232b3a; }
.loading { text-align: center; padding: 4rem 1rem; }
.badge-row { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 0.9rem; }
.badge { display: inline-block; padding: 0.35rem 0.9rem; font-size: 0.85rem; font-weight: 700; border-radius: 999px; background: transparent; border: 1.5px solid #ffb347; color: #ffb347; }
.fb-link { display: inline-block; margin-top: 0.7rem; font-weight: 700; color: #ffb347; }
.deco { margin-bottom: 0.4rem; }
a:focus-visible, .btn:focus-visible { outline: 3px solid #ffb347; outline-offset: 2px; }

</style>
</head>
<body>
<div class="banner" id="banner" role="note"></div>
<header class="hero">
  <svg class="deco" width="64" height="64" viewBox="0 0 100 120" aria-hidden="true"><circle cx="50" cy="48" r="34" fill="none" stroke="#ffb347" stroke-width="4"/><path d="M42 62 L46 40 L50 62 L54 40 L58 62" fill="none" stroke="#ffb347" stroke-width="3"/><line x1="50" y1="14" x2="50" y2="6" stroke="#ffb347" stroke-width="3"/><line x1="16" y1="14" x2="10" y2="8" stroke="#ffb347" stroke-width="3"/><line x1="84" y1="14" x2="90" y2="8" stroke="#ffb347" stroke-width="3"/><line x1="50" y1="82" x2="50" y2="104" stroke="#ffb347" stroke-width="4"/><line x1="42" y1="94" x2="58" y2="94" stroke="#ffb347" stroke-width="4"/></svg>
  <h1 id="biz-name">&hellip;</h1>
  <p class="tag" id="biz-tag"></p>
  <div class="badge-row"><span class="badge">4.9 stars on Google</span></div><a class="fb-link" href="https://www.facebook.com/filamenttattooco" target="_blank" rel="noopener">Find us on Facebook</a>
</header>
<div class="contact-bar">
  <a class="btn call" id="biz-phone" href="#">Call</a>
  <a class="btn dir" id="biz-dir" href="#" target="_blank" rel="noopener">Get Directions</a>
</div>
<p class="addr" id="biz-addr"></p>

<main id="content"><div class="loading">Loading&hellip;</div></main>
<footer>
  <p id="foot-name"></p>
  <p>Content managed with SiteKeeper.</p>
</footer>
<script>
fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    document.title = c.business.name + ' | ' + (c.business.tagline || '');
    document.getElementById('biz-name').textContent = c.business.name;
    document.getElementById('biz-tag').textContent = c.business.tagline || '';
    document.getElementById('biz-addr').textContent = c.business.address || '';
    document.getElementById('foot-name').textContent = c.business.name + ' — ' + (c.business.address || '');
    var ph = document.getElementById('biz-phone');
    ph.textContent = 'Call ' + (c.business.phone || '');
    ph.href = 'tel:' + (c.business.phone || '').replace(/\D/g, '');
    document.getElementById('biz-dir').href =
      'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.business.address || '');
    if (c.announcement) {
      var b = document.getElementById('banner');
      b.textContent = c.announcement;
      b.style.display = 'block';
    }
    var h = '';
    if (c.specials && c.specials.length) {
      h += '<section aria-label="Specials"><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b><span>' + esc(s.desc) + '</span></div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section><h2>' + esc(sec.section) + '</h2>' + (sec.items || []).map(it =>
        '<div class="item"><div class="n">' + esc(it.name) +
        (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') +
        '</div>' + (it.price ? '<div class="p">' + esc(it.price) + '</div>' : '') + '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section><h2>Hours</h2><table class="hours"><tbody>' + c.hours.map(x =>
        '<tr><td>' + esc(x.days) + '</td><td>' + esc(x.time) + '</td></tr>').join('') + '</tbody></table></section>';
    }
    document.getElementById('content').innerHTML = h;
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
