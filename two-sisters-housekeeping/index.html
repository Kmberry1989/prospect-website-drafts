<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Sisters Housekeeping Service — Kokomo, IN — House Cleaning</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f2faf7;color:#23403a;line-height:1.6}
.banner{display:none;background:#0f7b6c;color:#fff;text-align:center;padding:.8rem 1.2rem;font-weight:700;border-radius:0 0 18px 18px;margin:0 .8rem;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header{text-align:center;padding:2.4rem 1.2rem 1.2rem}
.badge{display:inline-block;background:#f5b301;color:#fff;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.35rem .9rem;border-radius:999px;margin-bottom:.9rem}
h1{font-size:clamp(1.9rem,6.5vw,2.8rem);color:#0c5b4f;line-height:1.15}
.tag{color:#5f7a73;margin-top:.4rem;font-size:1.02rem}
.addr{text-align:center;color:#5f7a73;padding:.4rem 1.2rem 1rem}
.cta{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;padding:0 1.2rem 2rem}
.cta a{min-height:52px;display:inline-flex;align-items:center;padding:.7rem 1.5rem;border-radius:999px;font-weight:700;text-decoration:none;font-size:1.02rem;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.cta .call{background:#0f7b6c;color:#fff}
.cta .dir{background:#ffffff;color:#0c5b4f;border:1px solid #d8e8e2}
.cta .fb{background:#ffffff;color:#5f7a73;border:1px solid #d8e8e2;display:none}
main{max-width:720px;margin:0 auto;padding:0 1.2rem 3rem}
.block{margin-bottom:1.8rem}
h2{color:#0c5b4f;font-size:1.2rem;margin-bottom:.9rem;display:flex;align-items:center;gap:.6rem}
h2::before{content:'';width:10px;height:10px;border-radius:50%;background:#0f7b6c}
.special{background:#ffffff;border-radius:14px;padding:1.1rem 1.2rem;margin-bottom:.8rem;border:1px solid #d8e8e2;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.special b{display:block;color:#0c5b4f;font-size:1.05rem}
.special span{color:#5f7a73;font-size:.94rem}
.item{background:#ffffff;border-radius:12px;padding:.9rem 1.1rem;margin-bottom:.7rem;border:1px solid #d8e8e2;display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.item .n{font-weight:700;color:#0c5b4f}
.item .n small{display:block;font-weight:400;color:#5f7a73;font-size:.86rem}
.item .p{color:#0f7b6c;font-weight:700;white-space:nowrap}
.hours{background:#ffffff;border-radius:14px;padding:.6rem 1.2rem;border:1px solid #d8e8e2}
.hrow{display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid #d8e8e2}
.hrow:last-child{border-bottom:none}
.hrow span:last-child{font-weight:700}
footer{text-align:center;padding:1.6rem;color:#5f7a73;font-size:.85rem}
.loading{text-align:center;padding:4rem 1rem;color:#5f7a73}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header>
<div class="badge" id="kicker2">Now Welcoming Clients</div>
<h1 id="biz-name">…</h1>
<div class="tag" id="biz-tag"></div>
</header>
<div class="addr" id="biz-addr"></div>
<div class="cta">
<a class="call" id="biz-phone" href="#" style="display:none">Call Now</a>
<a class="dir" id="biz-dir" href="#">Directions</a>
<a class="fb" id="fb-link" href="#">Facebook</a>
</div>
<main id="content"><div class="loading">Loading…</div></main>
<footer><span id="foot-name"></span><br><span id="foot-addr"></span></footer>
<script>

fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.title = b.name + ' — ' + c.meta.townTrade;
    set('biz-name', b.name); set('biz-tag', b.tagline);
    set('biz-addr', b.address);
    const ph = document.getElementById('biz-phone');
    if (b.phone) { ph.textContent = b.phone; ph.href = 'tel:+1' + b.phone.replace(/\D/g, ''); ph.style.display = ''; }
    const dl = document.getElementById('biz-dir');
    if (dl && b.address) dl.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.name + ' ' + b.address);
    const fb = document.getElementById('fb-link');
    if (fb && b.facebook) { fb.href = b.facebook; fb.style.display = ''; }
    const an = document.getElementById('banner');
    if (c.announcement) { an.textContent = c.announcement; an.style.display = 'block'; }
    let h = '';
    if (c.specials && c.specials.length) {
      h += '<section class="block"><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b>' + (s.desc ? '<span>' + esc(s.desc) + '</span>' : '') + '</div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section class="block"><h2>' + esc(sec.section) + '</h2>' +
        (sec.items || []).map(it =>
          '<div class="item"><div class="n">' + esc(it.name) +
          (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</div>' +
          (it.price ? '<div class="p">' + esc(it.price) + '</div>' : '') + '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section class="block"><h2>Hours</h2><div class="hours">' + c.hours.map(x =>
        '<div class="hrow"><span>' + esc(x.days) + '</span><span>' + esc(x.time) + '</span></div>').join('') + '</div></section>';
    }
    document.getElementById('content').innerHTML = h;
    document.getElementById('foot-name').textContent = b.name || '';
    document.getElementById('foot-addr').textContent = b.address || '';
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function set(id, v) { const e = document.getElementById(id); if (e && v) e.textContent = v; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

</script>
</body>
</html>
