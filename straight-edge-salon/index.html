<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Straight Edge Hair Salon — Rochester, IN — Hair Salon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;background:#f4f6f8;color:#2e3a46;line-height:1.6}
.banner{display:none;background:#4d7c96;color:#f4f6f8;text-align:center;padding:.75rem 1rem;font-weight:700}
header.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:#2f3b4c;color:#f4f6f8;padding:1.1rem 1.2rem}
header.top h1{font-size:clamp(1.4rem,5vw,2rem);line-height:1.2}
header.top .tag{font-style:italic;font-size:.95rem;opacity:.9}
.callbtn{flex:0 0 auto;min-width:48px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;background:#4d7c96;color:#f4f6f8;font-weight:700;text-decoration:none;border-radius:8px;padding:.6rem 1.1rem}
.hero{padding:2.2rem 1.2rem;text-align:center;border-bottom:3px double #dde4ea}
.hero .addr{color:#7a8a99;margin-bottom:1.2rem}
.links{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.links a{min-height:48px;display:inline-flex;align-items:center;padding:.6rem 1.2rem;border-radius:8px;text-decoration:none;font-weight:700}
.links .dir{border:2px solid #4d7c96;color:#4d7c96}
.links .fb{color:#7a8a99;border:2px solid #dde4ea;display:none}
main{max-width:760px;margin:0 auto;padding:2rem 1.2rem 3rem}
.block{margin-bottom:2.4rem}
h2{color:#2f3b4c;font-size:1.3rem;margin-bottom:1rem;padding-left:.7rem;border-left:5px solid #4d7c96}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.9rem}
.card{background:#ffffff;border:1px solid #dde4ea;border-radius:10px;padding:1rem 1.1rem}
.card .n{font-weight:700;font-size:1.02rem}
.card .n small{display:block;font-weight:400;color:#7a8a99;font-size:.86rem;margin-top:.25rem}
.card .p{color:#4d7c96;font-weight:700;margin-top:.3rem}
.special{background:#ffffff;border:1px solid #4d7c96;border-radius:10px;padding:1rem 1.1rem;margin-bottom:.8rem}
.special b{display:block;font-size:1.05rem;color:#2f3b4c}
.special span{color:#7a8a99;font-size:.95rem}
.hours{background:#ffffff;border:1px solid #dde4ea;border-radius:10px;overflow:hidden}
.hrow{display:flex;justify-content:space-between;padding:.65rem 1.1rem;border-bottom:1px solid #dde4ea}
.hrow:last-child{border-bottom:none}
.hrow span:last-child{font-weight:700}
footer{text-align:center;padding:1.6rem;color:#7a8a99;font-size:.85rem;border-top:1px solid #dde4ea}
.loading{text-align:center;padding:4rem 1rem;color:#7a8a99}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header class="top">
<div><h1 id="biz-name">…</h1><div class="tag" id="biz-tag"></div></div>
<a class="callbtn" id="biz-phone" href="#" style="display:none">Call</a>
</header>
<div class="hero">
<div class="addr" id="biz-addr"></div>
<div class="links"><a class="dir" id="biz-dir" href="#">Get Directions</a><a class="fb" id="fb-link" href="#">Facebook</a></div>
</div>
<main id="content"><div class="loading">Loading…</div></main>
<footer><span id="foot-name"></span><br><span id="foot-addr"></span></footer>
<script>

fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.title = b.name + ' — ' + c.meta.townTrade;
    set('biz-name', b.name); set('biz-tag', b.tagline);
    set('biz-addr', b.address);
    const ph = document.getElementById('biz-phone');
    if (b.phone) { ph.textContent = b.phone; ph.href = 'tel:+1' + b.phone.replace(/\D/g, ''); ph.style.display = ''; }
    const dl = document.getElementById('biz-dir');
    if (dl && b.address) dl.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.name + ' ' + b.address);
    const fb = document.getElementById('fb-link');
    if (fb && b.facebook) { fb.href = b.facebook; fb.style.display = ''; }
    const an = document.getElementById('banner');
    if (c.announcement) { an.textContent = c.announcement; an.style.display = 'block'; }
    let h = '';
    if (c.specials && c.specials.length) {
      h += '<section class="block"><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b>' + (s.desc ? '<span>' + esc(s.desc) + '</span>' : '') + '</div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section class="block"><h2>' + esc(sec.section) + '</h2>' +
        (sec.items || []).map(it =>
          '<div class="item"><div class="n">' + esc(it.name) +
          (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</div>' +
          (it.price ? '<div class="p">' + esc(it.price) + '</div>' : '') + '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section class="block"><h2>Hours</h2><div class="hours">' + c.hours.map(x =>
        '<div class="hrow"><span>' + esc(x.days) + '</span><span>' + esc(x.time) + '</span></div>').join('') + '</div></section>';
    }
    document.getElementById('content').innerHTML = h;
    document.getElementById('foot-name').textContent = b.name || '';
    document.getElementById('foot-addr').textContent = b.address || '';
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function set(id, v) { const e = document.getElementById(id); if (e && v) e.textContent = v; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

</script>
</body>
</html>
