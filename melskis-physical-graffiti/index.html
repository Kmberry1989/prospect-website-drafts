<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melski's Physical Graffiti | Tattoo & Piercing in Logansport, IN</title>
<meta name="description" content="Melski's Physical Graffiti — custom tattoos and cover-ups in Logansport, IN. Woman-owned shop. Call or text (574) 992-8176.">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.65; color: #f3eef2; background: #161216; }
.banner { display: none; text-align: center; padding: 0.8rem 1rem; font-weight: 700; background: #ff2e7e; color: #161216; }
.hero { text-align: center; padding: 3rem 1.2rem 2.2rem; background: radial-gradient(ellipse at 50% 0%, #2b1a24 0%, #161216 70%); border-bottom: 4px solid #ff2e7e; }
.hero h1 { font-family: Impact, "Arial Black", "Franklin Gothic Heavy", sans-serif; font-size: clamp(2.1rem, 8vw, 3.2rem); color: #ffffff; line-height: 1.15; margin: 0.6rem 0 0.4rem; }
.tag { font-size: 1.08rem; color: #ffb3cf; font-style: normal; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.98rem; font-weight: 700; }
.contact-bar { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; padding: 0 1.2rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; min-width: 160px; padding: 0.7rem 1.4rem; font-size: 1.05rem; font-weight: 700; text-decoration: none; border-radius: 4px; .btn.call { background: #ff2e7e; color: #161216; border: 2px solid #ff2e7e; } .btn.dir { background: transparent; color: #ff8fb8; border: 2px solid #ff2e7e; } }
.addr { text-align: center; padding: 0.9rem 1.2rem 0.4rem; color: #d9c9d2; font-size: 0.98rem; }
main { max-width: 760px; margin: 0 auto; padding: 1.6rem 1.2rem 3rem; }
section { margin-bottom: 2.4rem; }
section h2 { font-family: Impact, "Arial Black", "Franklin Gothic Heavy", sans-serif; font-size: 1.5rem; color: #ff8fb8; margin-bottom: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em; border-left: 6px solid #ff2e7e; padding-left: 0.7rem; }
.special { background: #241a21; border-left: 5px solid #ff2e7e; border-radius: 0 6px 6px 0; padding: 0.85rem 1rem; margin-bottom: 0.8rem; color: #f3eef2; }
.special b { display: block; font-size: 1.05rem; }
.special span { font-size: 0.96rem; }
.item { display: flex; justify-content: space-between; gap: 1rem; padding: 0.65rem 0; border-bottom: 1px dashed #4a3540; }
.item .n { font-weight: 700; font-size: 1.02rem; }
.item .n small { display: block; font-weight: 400; font-size: 0.9rem; color: #c9b6c0; margin-top: 0.15rem; }
.item .p { font-weight: 700; white-space: nowrap; color: #ff8fb8; }
.hours { width: 100%; border-collapse: collapse; }
.hours td { padding: 0.55rem 0; border-bottom: 1px dotted #4a3540; }
.hours td:last-child { text-align: right; font-weight: 700; }
footer { text-align: center; padding: 1.6rem 1.2rem 2.2rem; font-size: 0.88rem; color: #8f7d88; border-top: 2px solid #3a2a33; }
.loading { text-align: center; padding: 4rem 1rem; }
.badge-row { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 0.9rem; }
.badge { display: inline-block; padding: 0.35rem 0.9rem; font-size: 0.85rem; font-weight: 700; border-radius: 999px; background: #ff2e7e; color: #161216; text-transform: uppercase; letter-spacing: 0.05em; }
.fb-link { display: inline-block; margin-top: 0.7rem; font-weight: 700; color: #ff8fb8; }
.deco { margin-bottom: 0.4rem; }
a:focus-visible, .btn:focus-visible { outline: 3px solid #ff2e7e; outline-offset: 2px; }

</style>
</head>
<body>
<div class="banner" id="banner" role="note"></div>
<header class="hero">
  <svg class="deco" width="120" height="46" viewBox="0 0 120 46" aria-hidden="true"><path d="M4 42 L30 4 L44 4 L18 42 Z" fill="#ff2e7e"/><path d="M52 42 L78 4 L88 4 L62 42 Z" fill="#ff2e7e" opacity="0.55"/><path d="M92 42 L118 4 L116 4 L90 42 Z" fill="#ff2e7e" opacity="0.25"/></svg>
  <h1 id="biz-name">&hellip;</h1>
  <p class="tag" id="biz-tag"></p>
  <div class="badge-row"><span class="badge">Woman-owned shop</span><span class="badge">4.8 stars on Google</span></div><a class="fb-link" href="https://www.facebook.com/Melskis/" target="_blank" rel="noopener">Find us on Facebook</a>
</header>
<div class="contact-bar">
  <a class="btn call" id="biz-phone" href="#">Call</a>
  <a class="btn dir" id="biz-dir" href="#" target="_blank" rel="noopener">Get Directions</a>
</div>
<p class="addr" id="biz-addr"></p>

<main id="content"><div class="loading">Loading&hellip;</div></main>
<footer>
  <p id="foot-name"></p>
  <p>Content managed with SiteKeeper.</p>
</footer>
<script>
fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    document.title = c.business.name + ' | ' + (c.business.tagline || '');
    document.getElementById('biz-name').textContent = c.business.name;
    document.getElementById('biz-tag').textContent = c.business.tagline || '';
    document.getElementById('biz-addr').textContent = c.business.address || '';
    document.getElementById('foot-name').textContent = c.business.name + ' — ' + (c.business.address || '');
    var ph = document.getElementById('biz-phone');
    ph.textContent = 'Call ' + (c.business.phone || '');
    ph.href = 'tel:' + (c.business.phone || '').replace(/\D/g, '');
    document.getElementById('biz-dir').href =
      'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.business.address || '');
    if (c.announcement) {
      var b = document.getElementById('banner');
      b.textContent = c.announcement;
      b.style.display = 'block';
    }
    var h = '';
    if (c.specials && c.specials.length) {
      h += '<section aria-label="Specials"><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b><span>' + esc(s.desc) + '</span></div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section><h2>' + esc(sec.section) + '</h2>' + (sec.items || []).map(it =>
        '<div class="item"><div class="n">' + esc(it.name) +
        (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') +
        '</div>' + (it.price ? '<div class="p">' + esc(it.price) + '</div>' : '') + '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section><h2>Hours</h2><table class="hours"><tbody>' + c.hours.map(x =>
        '<tr><td>' + esc(x.days) + '</td><td>' + esc(x.time) + '</td></tr>').join('') + '</tbody></table></section>';
    }
    document.getElementById('content').innerHTML = h;
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
