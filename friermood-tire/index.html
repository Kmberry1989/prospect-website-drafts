<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<link rel="icon" href="data:,">
<title>Friermood Tire — Peru, IN | Tires &amp; Auto Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #101010;
    --asphalt: #1a1a1a;
    --amber: #ffb400;
    --amber-ink: #231600;
    --steel: #b9bec6;
    --paper: #f4f1ea;
    --ink: #23211c;
    --muted: #6e675a;
    --line: #ddd6c6;
  }
  body { font-family: "Work Sans", system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.58; font-size: 17px; }
  a { color: inherit; }
  .tread { height: 16px; background:
    repeating-linear-gradient(115deg, var(--amber) 0 14px, var(--black) 14px 22px, var(--black) 22px 30px, transparent 30px 44px),
    var(--black); }
  .banner { background: var(--amber); color: var(--amber-ink); text-align: center; padding: 0.75rem 1rem; font-weight: 700; display: none; }
  header { background: var(--black); color: #fff; text-align: center; padding: 2.8rem 1.25rem 2.2rem; }
  header .kicker { font-family: "Oswald", sans-serif; letter-spacing: 0.3em; text-transform: uppercase; font-size: 0.82rem; color: var(--amber); margin-bottom: 0.7rem; }
  header h1 { font-family: "Oswald", sans-serif; font-weight: 700; font-size: clamp(2.5rem, 10vw, 3.8rem); text-transform: uppercase; line-height: 1; letter-spacing: 0.02em; }
  header h1 .t { color: var(--amber); }
  header .tag { margin-top: 0.8rem; color: var(--steel); font-size: 1.05rem; }
  header .est { display: inline-block; margin-top: 1rem; background: var(--amber); color: var(--amber-ink); font-family: "Oswald", sans-serif; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.4rem 1.1rem; transform: skewX(-8deg); }
  .cta { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; padding: 1.6rem 1.25rem 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 58px; padding: 0.85rem 1.6rem; font-family: "Oswald", sans-serif; font-weight: 600; font-size: 1.2rem; letter-spacing: 0.05em; text-transform: uppercase; text-decoration: none; }
  .btn.primary { background: var(--amber); color: var(--amber-ink); clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); padding-inline: 2rem; }
  .btn.alt { border: 3px solid var(--black); color: var(--black); clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); padding-inline: 2rem; }
  .btn:active { transform: translateY(2px); }
  main { max-width: 760px; margin: 0 auto; padding: 1.6rem 1.25rem 2.5rem; }
  section { margin-bottom: 2.4rem; }
  h2 { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.7rem; }
  h2::after { content: ""; flex: 1; height: 6px; background: repeating-linear-gradient(-55deg, var(--amber) 0 10px, transparent 10px 18px); }
  .special { background: #fff8e6; border: 2px solid var(--amber); padding: 1rem 1.1rem; margin-bottom: 0.9rem; transform: skewX(-1.5deg); }
  .special b { display: block; font-family: "Oswald", sans-serif; text-transform: uppercase; font-size: 1.2rem; }
  .special span { color: var(--muted); font-size: 0.95rem; }
  .svc { background: #fff; border: 1px solid var(--line); border-left: 8px solid var(--black); padding: 0.95rem 1.1rem; margin-bottom: 0.7rem; }
  .svc .n { font-weight: 700; font-size: 1.06rem; }
  .svc .n small { display: block; font-weight: 400; color: var(--muted); font-size: 0.9rem; }
  .hours { width: 100%; border-collapse: collapse; background: var(--black); color: #fff; }
  .hours td { padding: 0.8rem 1.1rem; border-bottom: 1px solid #2c2c2c; }
  .hours tr:last-child td { border-bottom: none; }
  .hours td:last-child { text-align: right; font-weight: 700; color: var(--amber); font-family: "Oswald", sans-serif; letter-spacing: 0.04em; }
  .visit { background: var(--asphalt); color: #e8e4da; padding: 1.4rem; }
  .visit p { margin-bottom: 0.5rem; color: var(--steel); }
  .visit a { color: var(--amber); font-weight: 700; }
  footer { text-align: center; padding: 1.4rem 1rem 2.2rem; color: var(--muted); font-size: 0.85rem; background: var(--black); color: #8f8a7d; }
  .loading { text-align: center; padding: 4rem 1rem; color: var(--muted); }
</style>
</head>
<body>
<div class="tread" aria-hidden="true"></div>
<div class="banner" id="banner"></div>
<header>
  <div class="kicker">Peru, Indiana</div>
  <h1 id="biz-name">…</h1>
  <p class="tag" id="biz-tag"></p>
  <span class="est">Since 1950</span>
</header>
<div class="cta">
  <a class="btn primary" id="call-btn" href="#">Call Now</a>
  <a class="btn alt" id="dir-btn" href="#" target="_blank" rel="noopener">Directions</a>
</div>
<main id="content"><div class="loading">Loading…</div></main>
<footer><span id="foot-name"></span> · Content managed with SiteKeeper.</footer>
<div class="tread" aria-hidden="true"></div>
<script>
fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.title = b.name + ' — Peru, IN | Tires & Auto Service';
    const parts = String(b.name || '').split(' ');
    document.getElementById('biz-name').innerHTML = esc(parts.slice(0, -1).join(' ')) + ' <span class="t">' + esc(parts.slice(-1).join(' ')) + '</span>';
    document.getElementById('biz-tag').textContent = b.tagline || '';
    document.getElementById('foot-name').textContent = b.name || '';
    const banner = document.getElementById('banner');
    if (c.announcement) { banner.textContent = c.announcement; banner.style.display = 'block'; }
    const tel = 'tel:' + String(b.phone || '').replace(/\D/g, '');
    const callBtn = document.getElementById('call-btn');
    callBtn.href = tel;
    callBtn.textContent = b.phone || 'Call Now';
    const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.address || b.name);
    document.getElementById('dir-btn').href = mapsUrl;
    let h = '';
    if (c.specials && c.specials.length) {
      h += '<section><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b><span>' + esc(s.desc) + '</span></div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section><h2>' + esc(sec.section) + '</h2>' + (sec.items || []).map(it =>
        '<div class="svc"><div class="n">' + esc(it.name) +
        (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</div></div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section><h2>Hours</h2><table class="hours">' + c.hours.map(x =>
        '<tr><td>' + esc(x.days) + '</td><td>' + esc(x.time) + '</td></tr>').join('') + '</table></section>';
    }
    h += '<section><h2>Find Us</h2><div class="visit"><p>' + esc(b.address || '') + '</p>' +
      '<p>Phone: <a href="' + tel + '">' + esc(b.phone || '') + '</a></p>' +
      '<p><a href="' + mapsUrl + '" target="_blank" rel="noopener">Open in Google Maps &#8599;</a></p></div></section>';
    document.getElementById('content').innerHTML = h;
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
