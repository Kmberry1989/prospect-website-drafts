<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sycamore Drive-In — Logansport, IN | Frozen Custard Drive-In</title>
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Trebuchet MS', Verdana, sans-serif; color: #23303a; background: #fdf6ea; line-height: 1.6; }
.banner { background: #0f7b8a; color: #ffffff; text-align: center; padding: 0.85rem 1rem; font-weight: 700; font-size: 1rem; display: none; }
.masthead { padding: 2.6rem 1.2rem 2rem; text-align: center; background: radial-gradient(circle at 50% 120%, #ff8fab 0, #fdf6ea 60%), #fdf6ea; }
.masthead h1 { font-size: clamp(2rem, 9vw, 3.2rem); line-height: 1.05; color:#0f7b8a; letter-spacing: 2px; text-shadow: 2px 2px 0 #ffd166; }
.tag { margin-top: 0.5rem; font-size: 1.05rem; color:#b23a48; font-family: Georgia, serif; font-style: italic; font-weight: bold; }
.contact { text-align: center; padding: 1.4rem 1.2rem;  }
.addr { margin-top: 0.8rem; font-size: 0.95rem; color: #5c6b72; }
.btn { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 1.6rem; margin: 0.25rem; border-radius: 999px; font-weight: 800; text-decoration: none; font-size: 1.05rem; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.call { background: #0f7b8a; color: #ffffff; }
.dir { background: transparent; color: #0f7b8a; border: 2px solid #0f7b8a; }
main { max-width: 760px; margin: 0 auto; padding: 0.5rem 1.2rem 3rem; }
section { margin-bottom: 2.4rem; }
.sec-title { font-size: 1.5rem; margin-bottom: 0.9rem; padding-bottom: 0.35rem; color:#0f7b8a; border-bottom: 3px double #ff8fab; }
.special { background: #ffffff; border-radius: 10px; padding: 0.9rem 1.1rem; margin-bottom: 0.8rem; border-left: 6px solid #ff8fab; box-shadow: 0 2px 6px rgba(0,0,0,.07); }
.special h3 { font-size: 1.1rem; margin-bottom: 0.2rem; }
.special p { font-size: 0.95rem; color: #5c6b72; }
.item { display: flex; justify-content: space-between; gap: 1rem; padding: 0.65rem 0; border-bottom: 1px solid #eee0c6; }
.item-name { font-size: 1.05rem; font-weight: 700; }
.item-desc { font-size: 0.9rem; color: #5c6b72; }
.item-price { font-weight: 800; white-space: nowrap; color: #0f7b8a; }
.menu-note { font-size: 0.85rem; color: #5c6b72; font-style: italic; margin-bottom: 0.6rem; }
.hours { width: 100%; border-collapse: collapse; }
.hours td { padding: 0.55rem 0; border-bottom: 1px dotted #d8cbb2; }
.hours td:last-child { text-align: right; font-weight: 700; }
.loading { text-align: center; padding: 4rem 1rem; color: #5c6b72; }
footer { text-align: center; padding: 1.6rem 1rem 2.2rem; font-size: 0.85rem; color: #5c6b72; border-top: 3px double #ff8fab; }


.biz-logo{display:block;margin:0 auto .7rem;max-height:104px;width:auto;max-width:72%;border-radius:10px}
.hero-photo{display:block;margin:0 auto 1rem;max-height:230px;width:auto;max-width:88%;border-radius:12px}
.photos{max-width:760px;margin:0 auto 2.4rem;padding:0 1.2rem}
.photos h2{font-size:1.35rem;margin-bottom:.8rem}
.photo-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
.photo-strip img{width:100%;height:165px;object-fit:cover;border-radius:10px;display:block}
</style>
</head>
<body>
<div class="banner" id="banner" role="note"></div>
<header class="masthead">
  <div class="masthead-inner">
<img class="biz-logo" src="../assets/sycamore-drive-in/sycamore-drive-in-logo.jpg" alt="Sycamore Drive In logo">

    <h1 id="biz-name">&hellip;</h1>
    <p class="tag" id="biz-tag"></p>
  </div>
</header>
<div class="contact" id="contact">
  <a class="btn call" id="biz-phone" href="#">Call</a>
  <a class="btn dir" id="biz-dir" href="#" target="_blank" rel="noopener">Directions</a>
  <p class="addr" id="biz-addr"></p>
</div>
<main id="content"><p class="loading">Loading&hellip;</p></main>

<section class="photos" aria-label="From the window">
<h2 class="sec-title">From the window</h2>
<div class="photo-strip">
<img src="../assets/sycamore-drive-in/sycamore-drive-in-1.jpg" alt="Frozen custard treat from Sycamore Drive-In" loading="lazy"><img src="../assets/sycamore-drive-in/sycamore-drive-in-2.jpg" alt="Treats from the Sycamore Drive-In menu" loading="lazy"><img src="../assets/sycamore-drive-in/sycamore-drive-in-3.jpg" alt="A Sycamore Drive-In favorite" loading="lazy">
</div>
</section>
<footer>Family-owned since 1948 · Car-hop service & outdoor seating</footer>
<script>
fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    document.title = c.business.name + ' — ' + "Logansport, IN" + ' | ' + "Frozen Custard Drive-In";
    document.getElementById('biz-name').textContent = c.business.name;
    document.getElementById('biz-tag').textContent = c.business.tagline || '';
    document.getElementById('biz-addr').textContent = c.business.address || '';
    var digits = (c.business.phone || '').replace(/\D/g, '');
    var ph = document.getElementById('biz-phone');
    ph.textContent = 'Call ' + (c.business.phone || '');
    ph.href = 'tel:' + digits;
    document.getElementById('biz-dir').href =
      'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.business.name + ' ' + (c.business.address || ''));
    if (c.announcement) {
      var b = document.getElementById('banner');
      b.textContent = c.announcement;
      b.style.display = 'block';
    }
    var h = '';
    if (c.specials && c.specials.length) {
      h += '<section aria-label="Specials"><h2 class="sec-title">Specials</h2>' +
        c.specials.map(s =>
          '<article class="special"><h3>' + esc(s.title) + '</h3><p>' + esc(s.desc) + '</p></article>').join('') +
        '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section aria-label="' + esc(sec.section) + '"><h2 class="sec-title">' + esc(sec.section) + '</h2>';
      if (sec.note) h += '<p class="menu-note">' + esc(sec.note) + '</p>';
      h += (sec.items || []).map(it =>
        '<div class="item"><div class="item-main"><h3 class="item-name">' + esc(it.name) + '</h3>' +
        (it.desc ? '<p class="item-desc">' + esc(it.desc) + '</p>' : '') + '</div>' +
        (it.price ? '<div class="item-price">' + esc(it.price) + '</div>' : '') +
        '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section aria-label="Hours"><h2 class="sec-title">Hours</h2><table class="hours">' +
        c.hours.map(x => '<tr><td>' + esc(x.days) + '</td><td>' + esc(x.time) + '</td></tr>').join('') +
        '</table></section>';
    }
    document.getElementById('content').innerHTML = h || '<p class="loading">Menu coming soon — call us!</p>';
  })
  .catch(() => { document.getElementById('content').innerHTML = '<p class="loading">Could not load content.</p>'; });
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
