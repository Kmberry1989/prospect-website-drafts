<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deb's Laundry | Laundromat in Marion, IN</title>
<meta name="description" content="Deb's Laundry in Marion, IN — self-serve and wash-and-fold laundry with an attendant always on duty. Call (765) 664-8206.">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.65; color: #1e2a4a; background: #ffffff; }
.banner { display: none; text-align: center; padding: 0.8rem 1rem; font-weight: 700; background: #2447a8; color: #fff; }
.hero { text-align: center; padding: 3rem 1.2rem 2.2rem; background: radial-gradient(circle at 80% 10%, rgba(36,71,168,0.10) 0 110px, transparent 111px), radial-gradient(circle at 10% 90%, rgba(255,209,63,0.25) 0 80px, transparent 81px), linear-gradient(180deg, #eef3ff 0%, #ffffff 100%); border-bottom: 4px solid #2447a8; }
.hero h1 { font-family: Verdana, "Segoe UI", sans-serif; font-size: clamp(2.1rem, 8vw, 3.2rem); color: #2447a8; line-height: 1.15; margin: 0.6rem 0 0.4rem; }
.tag { font-size: 1.08rem; color: #4a5d85; font-weight: 600; }
.contact-bar { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; padding: 0 1.2rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; min-width: 160px; padding: 0.7rem 1.4rem; font-size: 1.05rem; font-weight: 700; text-decoration: none; border-radius: 8px; .btn.call { background: #2447a8; color: #fff; border: none; } .btn.dir { background: #ffd13f; color: #1e2a4a; border: none; } }
.addr { text-align: center; padding: 0.9rem 1.2rem 0.4rem; color: #5c6c92; font-size: 0.98rem; }
main { max-width: 760px; margin: 0 auto; padding: 1.6rem 1.2rem 3rem; }
section { margin-bottom: 2.4rem; }
section h2 { font-family: Verdana, "Segoe UI", sans-serif; font-size: 1.5rem; color: #2447a8; margin-bottom: 0.9rem; border-bottom: 3px solid #ffd13f; padding-bottom: 0.3rem; }
.special { background: #f4f7ff; border: 2px solid #2447a8; border-radius: 12px; padding: 0.85rem 1rem; margin-bottom: 0.8rem; color: #1e2a4a; }
.special b { display: block; font-size: 1.05rem; }
.special span { font-size: 0.96rem; }
.item { display: flex; justify-content: space-between; gap: 1rem; padding: 0.65rem 0; border-bottom: 1px dotted #c9d4ee; }
.item .n { font-weight: 700; font-size: 1.02rem; }
.item .n small { display: block; font-weight: 400; font-size: 0.9rem; color: #5c6c92; margin-top: 0.15rem; }
.item .p { font-weight: 700; white-space: nowrap; color: #2447a8; }
.hours { width: 100%; border-collapse: collapse; }
.hours td { padding: 0.55rem 0; border-bottom: 1px dotted #c9d4ee; }
.hours td:last-child { text-align: right; font-weight: 700; }
footer { text-align: center; padding: 1.6rem 1.2rem 2.2rem; font-size: 0.88rem; color: #8a96b5; border-top: 4px solid #ffd13f; }
.loading { text-align: center; padding: 4rem 1rem; }
.badge-row { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 0.9rem; }
.badge { display: inline-block; padding: 0.35rem 0.9rem; font-size: 0.85rem; font-weight: 700; border-radius: 999px; background: #2447a8; color: #fff; text-transform: uppercase; letter-spacing: 0.04em; }
.fb-link { display: inline-block; margin-top: 0.7rem; font-weight: 700; color: #2447a8; }
.deco { margin-bottom: 0.4rem; }
a:focus-visible, .btn:focus-visible { outline: 3px solid #2447a8; outline-offset: 2px; }

</style>
<!--kb-packs-->
<style>
/* Kyle Berry site enhancement packs: a11y + reveal + responsive */
/* Pack A — accessibility guardrails (injected into every concept site) */

/* Visible keyboard focus everywhere */
:focus-visible { outline: 3px solid #4d9fff; outline-offset: 2px; border-radius: 4px; }

/* Text over imagery: scrim shadow so words survive any background.
   Applied to reading text only — buttons keep their designed surfaces. */
.hero h1, .hero h2, .hero h3, .hero p, .hero li,
[class*="hero"] h1, [class*="hero"] h2, [class*="hero"] h3, [class*="hero"] p, [class*="hero"] li,
.banner h1, .banner h2, .banner h3, .banner p,
[class*="banner"] h1, [class*="banner"] h2, [class*="banner"] h3, [class*="banner"] p,
figcaption {
  text-shadow: 0 1px 3px rgba(0,0,0,.55), 0 2px 14px rgba(0,0,0,.35);
}

/* Long words never break layouts on narrow screens */
p, li, h1, h2, h3 { overflow-wrap: break-word; }

/* Motion respects the visitor */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Pack B — scrollytelling reveal (injected into every concept site) */
/* Hidden states only apply when JS is running (html.js), so no-JS visitors see everything. */
html.js .rv { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
html.js .rv.in { opacity: 1; transform: none; }
/* Specials / offers get a little extra pop */
html.js .rv-pop { opacity: 0; transform: translateY(26px) scale(.96); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
html.js .rv-pop.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html.js .rv, html.js .rv-pop { opacity: 1; transform: none; transition: none; }
}

/* Pack C — desktop/mobile differentiation (injected into every concept site) */

/* Mobile: roomy tap targets on anything that looks like a call-to-action */
@media (max-width: 720px) {
  .btn, .button, a[class*="btn"], a[class*="button"], button {
    min-height: 48px;
  }
  /* Sticky tap-to-call bar (created by pack-reveal.js); mobile only */
  .kb-callbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center; gap: .5rem;
    padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    font: 700 1.05rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-decoration: none; color: #fff; background: #1d7a3d;
    box-shadow: 0 -4px 18px rgba(0,0,0,.25);
  }
  body.kb-has-callbar { padding-bottom: 76px; }
}
@media (min-width: 721px) {
  .kb-callbar { display: none; }
}

</style>
</head>
<body>
<div class="banner" id="banner" role="note"></div>
<header class="hero">
  <svg class="deco" width="120" height="40" viewBox="0 0 120 40" aria-hidden="true"><g fill="none" stroke="#2447a8" stroke-width="3" opacity="0.7"><circle cx="24" cy="24" r="12"/><circle cx="52" cy="14" r="8"/><circle cx="76" cy="26" r="10"/><circle cx="100" cy="12" r="6"/></g></svg>
  <h1 id="biz-name">&hellip;</h1>
  <p class="tag" id="biz-tag"></p>
  <div class="badge-row"><span class="badge">Attendant always on duty</span><span class="badge">Family business</span><span class="badge">5.0 stars on Google</span></div>
</header>
<div class="contact-bar">
  <a class="btn call" id="biz-phone" href="#">Call</a>
  <a class="btn dir" id="biz-dir" href="#" target="_blank" rel="noopener">Get Directions</a>
</div>
<p class="addr" id="biz-addr"></p>

<main id="content"><div class="loading">Loading&hellip;</div></main>
<footer>
  <p id="foot-name"></p>
  <p>Content managed with SiteKeeper.</p>
</footer>
<script>
fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    document.title = c.business.name + ' | ' + (c.business.tagline || '');
    document.getElementById('biz-name').textContent = c.business.name;
    document.getElementById('biz-tag').textContent = c.business.tagline || '';
    document.getElementById('biz-addr').textContent = c.business.address || '';
    document.getElementById('foot-name').textContent = c.business.name + ' — ' + (c.business.address || '');
    var ph = document.getElementById('biz-phone');
    ph.textContent = 'Call ' + (c.business.phone || '');
    ph.href = 'tel:' + (c.business.phone || '').replace(/\D/g, '');
    document.getElementById('biz-dir').href =
      'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.business.address || '');
    if (c.announcement) {
      var b = document.getElementById('banner');
      b.textContent = c.announcement;
      b.style.display = 'block';
    }
    var h = '';
    if (c.specials && c.specials.length) {
      h += '<section aria-label="Specials"><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b><span>' + esc(s.desc) + '</span></div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section><h2>' + esc(sec.section) + '</h2>' + (sec.items || []).map(it =>
        '<div class="item"><div class="n">' + esc(it.name) +
        (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') +
        '</div>' + (it.price ? '<div class="p">' + esc(it.price) + '</div>' : '') + '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section><h2>Hours</h2><table class="hours"><tbody>' + c.hours.map(x =>
        '<tr><td>' + esc(x.days) + '</td><td>' + esc(x.time) + '</td></tr>').join('') + '</tbody></table></section>';
    }
    document.getElementById('content').innerHTML = h;
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
<!--kb-packs-->
<script>
/* Pack B+C runtime: scrollytelling reveals + mobile call bar.
   Runs after parse; content stays visible if this never executes. */
(function () {
  document.documentElement.classList.add('js');

  function onReady() {
    /* ---- scrollytelling: fade/slide sections in as they enter ---- */
    var special = /special|offer|deal|\bsale\b|limited|coupon|discount|save\b/i;
    var sections = document.querySelectorAll('body > section, body > main > section, body > main > div > section');
    var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' }) : null;

    sections.forEach(function (sec) {
      if (sec.classList.contains('rv') || sec.classList.contains('rv-pop')) return;
      var pop = special.test(sec.textContent || '');
      sec.classList.add(pop ? 'rv-pop' : 'rv');
      if (io) io.observe(sec);
      else sec.classList.add('in');
    });

    /* ---- mobile differentiation: sticky tap-to-call bar ---- */
    try {
      var tel = document.querySelector('a[href^="tel:"]');
      var already = document.querySelector('.kb-callbar, [class*="sticky-call"], [class*="call-bar"]');
      if (tel && !already) {
        var name = (document.querySelector('h1') || {}).textContent || 'us';
        name = name.trim().split('\n')[0].slice(0, 34);
        var bar = document.createElement('a');
        bar.className = 'kb-callbar';
        bar.href = tel.getAttribute('href');
        bar.textContent = '\uD83D\uDCDE Call ' + name;
        document.body.appendChild(bar);
        document.body.classList.add('kb-has-callbar');
      }
    } catch (err) { /* never break the page for a call bar */ }
  }

  if (document.readyState !== 'loading') onReady();
  else document.addEventListener('DOMContentLoaded', onReady);
})();

</script>
</body>
</html>
