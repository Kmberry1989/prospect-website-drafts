<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1f3c">
<link rel="icon" href="data:,">
<title>M &amp; B Body Shop — Wabash, IN | Collision &amp; Auto Body Repair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --midnight: #0d1f3c;
    --midnight-2: #12294e;
    --steel: #9fb3c8;
    --steel-bright: #d3e0ee;
    --silver: #e8edf3;
    --paper: #f4f7fa;
    --ink: #1b2430;
    --muted: #5d6f84;
    --card: #ffffff;
    --line: #dbe3ec;
  }
  body { font-family: "Public Sans", system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.6; font-size: 17px; }
  a { color: inherit; }
  .banner { background: var(--steel-bright); color: var(--midnight); text-align: center; padding: 0.75rem 1rem; font-weight: 700; border-bottom: 3px solid var(--steel); display: none; }
  header { background: linear-gradient(180deg, var(--midnight) 0%, var(--midnight-2) 100%); color: #fff; padding: 2.6rem 1.25rem 0; text-align: center; }
  header .kicker { font-family: "Saira Semi Condensed", sans-serif; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; font-size: 0.82rem; color: var(--steel); margin-bottom: 0.6rem; }
  header h1 { font-family: "Saira Semi Condensed", sans-serif; font-weight: 800; font-size: clamp(2.4rem, 9.5vw, 3.6rem); line-height: 1; text-transform: uppercase; letter-spacing: 0.02em; }
  header h1 .amp { color: var(--steel); }
  header .tag { margin-top: 0.8rem; color: var(--steel-bright); font-size: 1.03rem; }
  header .fam { display: inline-block; margin-top: 1rem; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--midnight); background: var(--silver); padding: 0.4rem 1.1rem; border-radius: 4px; }
  .cta-band { background: var(--midnight-2); padding: 1.6rem 1.25rem 1.8rem; }
  .cta-band .row { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; max-width: 560px; margin: 0 auto; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0.8rem 1.6rem; font-family: "Saira Semi Condensed", sans-serif; font-weight: 700; font-size: 1.22rem; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; border-radius: 4px; }
  .btn.primary { background: var(--silver); color: var(--midnight); }
  .btn.alt { background: transparent; color: var(--steel-bright); border: 2px solid var(--steel); }
  .btn:active { transform: translateY(1px); }
  main { max-width: 740px; margin: 0 auto; padding: 1.8rem 1.25rem 2.5rem; }
  section { margin-bottom: 2.4rem; }
  h2 { font-family: "Saira Semi Condensed", sans-serif; font-weight: 800; font-size: 1.75rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--midnight); margin-bottom: 1rem; border-bottom: 3px solid var(--steel); padding-bottom: 0.4rem; }
  .special { background: var(--card); border: 1px solid var(--line); border-left: 8px solid var(--steel); padding: 1rem 1.1rem; margin-bottom: 0.9rem; border-radius: 0 8px 8px 0; box-shadow: 0 4px 14px rgba(13,31,60,.07); }
  .special b { display: block; font-family: "Saira Semi Condensed", sans-serif; font-size: 1.25rem; text-transform: uppercase; color: var(--midnight); }
  .special span { color: var(--muted); font-size: 0.95rem; }
  .svc { display: grid; grid-template-columns: 56px 1fr; gap: 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-bottom: 0.8rem; align-items: center; }
  .svc .badge { width: 56px; height: 56px; border-radius: 8px; background: var(--midnight); color: var(--steel-bright); display: flex; align-items: center; justify-content: center; font-family: "Saira Semi Condensed", sans-serif; font-weight: 800; font-size: 1.3rem; }
  .svc .n { font-weight: 700; font-size: 1.06rem; }
  .svc .n small { display: block; font-weight: 400; color: var(--muted); font-size: 0.9rem; }
  .hours { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .hours td { padding: 0.8rem 1.1rem; border-bottom: 1px solid var(--line); }
  .hours tr:last-child td { border-bottom: none; }
  .hours td:first-child { font-weight: 600; }
  .hours td:last-child { text-align: right; font-weight: 700; color: var(--midnight); background: var(--silver); }
  .visit { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.3rem; }
  .visit p { margin-bottom: 0.5rem; color: var(--muted); }
  .visit a { color: var(--midnight-2); font-weight: 700; }
  footer { text-align: center; padding: 1.6rem 1rem 2.4rem; color: var(--muted); font-size: 0.85rem; }
  .loading { text-align: center; padding: 4rem 1rem; color: var(--muted); }
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header>
  <div class="kicker">Wabash, Indiana</div>
  <h1 id="biz-name">…</h1>
  <p class="tag" id="biz-tag"></p>
  <span class="fam">Family Owned</span>
</header>
<div class="cta-band"><div class="row">
  <a class="btn primary" id="call-btn" href="#">Call Now</a>
  <a class="btn alt" id="dir-btn" href="#" target="_blank" rel="noopener">Directions</a>
</div></div>
<main id="content"><div class="loading">Loading…</div></main>
<footer><span id="foot-name"></span> · Content managed with SiteKeeper.</footer>
<script>
fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.title = b.name + ' — Wabash, IN | Collision & Auto Body Repair';
    document.getElementById('biz-name').innerHTML = esc(b.name || '').replace(/&amp;|&/g, '<span class="amp">&amp;</span>');
    document.getElementById('biz-tag').textContent = b.tagline || '';
    document.getElementById('foot-name').textContent = b.name || '';
    const banner = document.getElementById('banner');
    if (c.announcement) { banner.textContent = c.announcement; banner.style.display = 'block'; }
    const tel = 'tel:' + String(b.phone || '').replace(/\D/g, '');
    const callBtn = document.getElementById('call-btn');
    callBtn.href = tel;
    callBtn.textContent = b.phone || 'Call Now';
    const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.address || b.name);
    document.getElementById('dir-btn').href = mapsUrl;
    let h = '';
    if (c.specials && c.specials.length) {
      h += '<section><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b><span>' + esc(s.desc) + '</span></div>').join('') + '</section>';
    }
    const icons = ['&#9670;', '&#9632;', '&#9679;', '&#9650;', '&#9733;', '&#10022;'];
    (c.menu || []).forEach(sec => {
      h += '<section><h2>' + esc(sec.section) + '</h2>' + (sec.items || []).map((it, i) =>
        '<div class="svc"><div class="badge" aria-hidden="true">' + icons[i % icons.length] + '</div><div class="n">' + esc(it.name) +
        (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</div></div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section><h2>Hours</h2><table class="hours">' + c.hours.map(x =>
        '<tr><td>' + esc(x.days) + '</td><td>' + esc(x.time) + '</td></tr>').join('') + '</table></section>';
    }
    h += '<section><h2>Find Us</h2><div class="visit"><p>' + esc(b.address || '') + '</p>' +
      '<p>Phone: <a href="' + tel + '">' + esc(b.phone || '') + '</a></p>' +
      (b.facebook ? '<p><a href="' + esc(b.facebook) + '" target="_blank" rel="noopener">Find us on Facebook &#8599;</a></p>' : '') +
      '<p><a href="' + mapsUrl + '" target="_blank" rel="noopener">Open in Google Maps &#8599;</a></p></div></section>';
    document.getElementById('content').innerHTML = h;
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
