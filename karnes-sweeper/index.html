<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karnes Sweeper Company — Marion, IN — Vacuum Sales & Repair</title>
<meta name="description" content="Karnes Sweeper Company in Marion, Indiana: family-owned vacuum cleaner sales and repair since 1939. All makes and models serviced.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy:#1f2a44; --navy-deep:#141b2e; --gold:#c9a227; --gold-soft:#efe3bd; --parchment:#f6f1e3; --ink:#2a2a26; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--parchment); color: var(--ink); line-height: 1.65; padding-bottom: 76px; }
  .banner { background: var(--gold); color: var(--navy-deep); text-align: center; padding: 0.7rem 1rem; font-weight: 700; font-size: 0.95rem; display: none; }
  header.hero { background: var(--navy); color: #fff; text-align: center; padding: 2.8rem 1.2rem 2rem; border-bottom: 6px solid var(--gold); }
  header .since { display: inline-block; border: 2px solid var(--gold); color: var(--gold); font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.8rem; padding: 0.35rem 1rem; border-radius: 999px; margin-bottom: 0.9rem; }
  header h1 { font-size: clamp(1.9rem, 7.5vw, 2.8rem); line-height: 1.1; letter-spacing: 0.01em; }
  header .tag { color: var(--gold-soft); font-size: 1.05rem; margin-top: 0.5rem; font-style: italic; }
  main { max-width: 720px; margin: 0 auto; padding: 0 1.2rem 3rem; }
  section { margin: 2rem 0; }
  h2 { font-size: 1.35rem; color: var(--navy); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.9rem; padding-bottom: 0.35rem; border-bottom: 3px solid var(--gold); }
  .special { background: #fff; border-left: 6px solid var(--gold); padding: 0.9rem 1rem; margin-bottom: 0.8rem; border-radius: 0 8px 8px 0; box-shadow: 0 1px 4px rgba(20,27,46,0.08); }
  .special b { display: block; }
  .special span { color: #5c5c52; font-size: 0.95rem; }
  .svc { background: #fff; border: 1px solid #e2d9c0; border-radius: 8px; padding: 0.85rem 1rem; margin-bottom: 0.7rem; display: flex; gap: 0.8rem; align-items: baseline; box-shadow: 0 1px 3px rgba(20,27,46,0.06); }
  .svc .tick { color: var(--gold); font-weight: 900; font-size: 1.2rem; }
  .svc .n { font-weight: 700; font-size: 1.05rem; }
  .svc .d { font-size: 0.92rem; color: #5c5c52; }
  table.hours { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e2d9c0; }
  table.hours td { padding: 0.6rem 1rem; border-bottom: 1px solid #eee6d0; }
  table.hours tr:last-child td { border-bottom: none; }
  table.hours td:last-child { text-align: right; font-weight: 700; color: var(--navy); }
  .visit { background: var(--navy); color: #fff; border-radius: 8px; padding: 1rem 1.1rem; font-size: 0.95rem; text-align: center; }
  .visit a { color: var(--gold); font-weight: 700; }
  .btn { display: block; text-align: center; text-decoration: none; padding: 0.95rem 1rem; border-radius: 8px; font-size: 1.1rem; min-height: 52px; margin-bottom: 0.7rem; font-weight: 700; }
  .btn.call { background: var(--gold); color: var(--navy-deep); }
  .btn.dir { background: #fff; color: var(--navy); border: 2px solid var(--navy); }
  footer { text-align: center; padding: 1.5rem 1rem 2rem; color: #8b8570; font-size: 0.85rem; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--navy-deep); z-index: 50; }
  .dock a { flex: 1; text-align: center; color: #fff; text-decoration: none; font-weight: 700; padding: 1rem 0.5rem; min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }
  .dock a + a { border-left: 1px solid rgba(255,255,255,0.2); }
  .loading { text-align: center; padding: 4rem 1rem; color: #8b8570; }
</style>
<!--kb-packs-->
<style>
/* Kyle Berry site enhancement packs: a11y + reveal + responsive */
/* Pack A — accessibility guardrails (injected into every concept site) */

/* Visible keyboard focus everywhere */
:focus-visible { outline: 3px solid #4d9fff; outline-offset: 2px; border-radius: 4px; }

/* Text over imagery: scrim shadow so words survive any background.
   Applied to reading text only — buttons keep their designed surfaces. */
.hero h1, .hero h2, .hero h3, .hero p, .hero li,
[class*="hero"] h1, [class*="hero"] h2, [class*="hero"] h3, [class*="hero"] p, [class*="hero"] li,
.banner h1, .banner h2, .banner h3, .banner p,
[class*="banner"] h1, [class*="banner"] h2, [class*="banner"] h3, [class*="banner"] p,
figcaption {
  text-shadow: 0 1px 3px rgba(0,0,0,.55), 0 2px 14px rgba(0,0,0,.35);
}

/* Long words never break layouts on narrow screens */
p, li, h1, h2, h3 { overflow-wrap: break-word; }

/* Motion respects the visitor */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* Pack B — scrollytelling reveal (injected into every concept site) */
/* Hidden states only apply when JS is running (html.js), so no-JS visitors see everything. */
html.js .rv { opacity: 0; transform: translateY(26px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
html.js .rv.in { opacity: 1; transform: none; }
/* Specials / offers get a little extra pop */
html.js .rv-pop { opacity: 0; transform: translateY(26px) scale(.96); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
html.js .rv-pop.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html.js .rv, html.js .rv-pop { opacity: 1; transform: none; transition: none; }
}

/* Pack C — desktop/mobile differentiation (injected into every concept site) */

/* Mobile: roomy tap targets on anything that looks like a call-to-action */
@media (max-width: 720px) {
  .btn, .button, a[class*="btn"], a[class*="button"], button {
    min-height: 48px;
  }
  /* Sticky tap-to-call bar (created by pack-reveal.js); mobile only */
  .kb-callbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center; gap: .5rem;
    padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    font: 700 1.05rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-decoration: none; color: #fff; background: #1d7a3d;
    box-shadow: 0 -4px 18px rgba(0,0,0,.25);
  }
  body.kb-has-callbar { padding-bottom: 76px; }
}
@media (min-width: 721px) {
  .kb-callbar { display: none; }
}

</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header class="hero">
  <div class="since">Since 1939</div>
  <h1 id="biz-name">…</h1>
  <div class="tag" id="biz-tag"></div>
</header>
<main id="content"><div class="loading">Loading…</div></main>
<footer>SiteKeeper-managed site</footer>
<nav class="dock" aria-label="Quick actions">
  <a id="dock-call" href="#">📞 Call</a>
  <a id="dock-dir" href="#">🧭 Directions</a>
</nav>
<script>
fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.getElementById('biz-name').textContent = b.name || '';
    document.getElementById('biz-tag').textContent = b.tagline || '';
    const tel = 'tel:+1' + (b.phone || '').replace(/\D/g, '');
    const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.address || '');
    document.getElementById('dock-call').href = tel;
    document.getElementById('dock-dir').href = maps;
    if (c.announcement) {
      const bn = document.getElementById('banner');
      bn.textContent = c.announcement;
      bn.style.display = 'block';
    }
    let h = '<section><a class="btn call" href="' + esc(tel) + '">Call ' + esc(b.phone || '') + '</a>' +
      '<a class="btn dir" href="' + esc(maps) + '">Get Directions</a>' +
      '<div class="visit">' + esc(b.address || '') + '</div></section>';
    if (c.specials && c.specials.length) {
      h += '<section><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b><span>' + esc(s.desc) + '</span></div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section><h2>' + esc(sec.section) + '</h2>' + (sec.items || []).map(it =>
        '<div class="svc"><span class="tick">★</span><div><div class="n">' + esc(it.name) + '</div>' +
        (it.desc ? '<div class="d">' + esc(it.desc) + '</div>' : '') + '</div></div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section><h2>Hours</h2><table class="hours"><tbody>' + c.hours.map(x =>
        '<tr><td>' + esc(x.days) + '</td><td>' + esc(x.time) + '</td></tr>').join('') + '</tbody></table></section>';
    }
    document.getElementById('content').innerHTML = h;
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content. Please try again later.</div>'; });
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
<!--kb-packs-->
<script>
/* Pack B+C runtime: scrollytelling reveals + mobile call bar.
   Runs after parse; content stays visible if this never executes. */
(function () {
  document.documentElement.classList.add('js');

  function onReady() {
    /* ---- scrollytelling: fade/slide sections in as they enter ---- */
    var special = /special|offer|deal|\bsale\b|limited|coupon|discount|save\b/i;
    var sections = document.querySelectorAll('body > section, body > main > section, body > main > div > section');
    var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' }) : null;

    sections.forEach(function (sec) {
      if (sec.classList.contains('rv') || sec.classList.contains('rv-pop')) return;
      var pop = special.test(sec.textContent || '');
      sec.classList.add(pop ? 'rv-pop' : 'rv');
      if (io) io.observe(sec);
      else sec.classList.add('in');
    });

    /* ---- mobile differentiation: sticky tap-to-call bar ---- */
    try {
      var tel = document.querySelector('a[href^="tel:"]');
      var already = document.querySelector('.kb-callbar, [class*="sticky-call"], [class*="call-bar"]');
      if (tel && !already) {
        var name = (document.querySelector('h1') || {}).textContent || 'us';
        name = name.trim().split('\n')[0].slice(0, 34);
        var bar = document.createElement('a');
        bar.className = 'kb-callbar';
        bar.href = tel.getAttribute('href');
        bar.textContent = '\uD83D\uDCDE Call ' + name;
        document.body.appendChild(bar);
        document.body.classList.add('kb-has-callbar');
      }
    } catch (err) { /* never break the page for a call bar */ }
  }

  if (document.readyState !== 'loading') onReady();
  else document.addEventListener('DOMContentLoaded', onReady);
})();

</script>
</body>
</html>
