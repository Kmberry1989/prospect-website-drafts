<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shear Envy Hair Studio — Wabash, IN — Color Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;background:#16181a;color:#e3e8e6;line-height:1.7}
.banner{display:none;background:#3fa98b;color:#16181a;text-align:center;padding:.8rem 1rem;font-weight:700;letter-spacing:.03em}
header{text-align:center;padding:3rem 1.2rem 2rem}
.orn{color:#3fa98b;letter-spacing:.6em;font-size:.85rem;margin-bottom:1rem}
h1{font-size:clamp(2.1rem,7vw,3.2rem);color:#f2f5f3;font-weight:400;line-height:1.15}
.rule{width:64px;height:2px;background:#3fa98b;margin:1.2rem auto}
.tag{font-style:italic;color:#93a09b;font-size:1.08rem}
.contact{text-align:center;padding:0 1.2rem 2.2rem}
.contact .addr{color:#93a09b;margin-bottom:1.1rem}
.contact a{display:inline-block;min-height:48px;line-height:48px;padding:0 1.6rem;margin:.3rem;border-radius:999px;text-decoration:none;font-weight:700}
.contact .call{background:#3fa98b;color:#16181a}
.contact .dir{border:1px solid #3fa98b;color:#3fa98b}
.contact .fb{border:1px solid #93a09b;color:#93a09b;display:none}
main{max-width:680px;margin:0 auto;padding:0 1.2rem 3rem}
.block{margin-bottom:2.8rem;text-align:center}
h2{color:#f2f5f3;font-size:1.15rem;letter-spacing:.28em;text-transform:uppercase;margin-bottom:1.2rem}
h2::after{content:'';display:block;width:44px;height:1px;background:#3fa98b;margin:.7rem auto 0}
.special{border:1px solid #3fa98b;border-radius:4px;padding:1rem;margin:0 auto 1rem;max-width:520px}
.special b{display:block;color:#f2f5f3;font-size:1.08rem}
.special span{color:#93a09b;font-size:.95rem}
.item{padding:.7rem 0;border-bottom:1px solid #333a3d;max-width:520px;margin:0 auto}
.item .n{font-weight:700;color:#f2f5f3}
.item .n small{display:block;font-weight:400;color:#93a09b;font-size:.87rem}
.item .p{color:#3fa98b;font-weight:700}
.hours{max-width:440px;margin:0 auto}
.hrow{display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid #333a3d}
.hrow span:last-child{color:#f2f5f3;font-weight:700}
footer{text-align:center;padding:1.8rem;color:#93a09b;font-size:.85rem}
.loading{text-align:center;padding:4rem 1rem;color:#93a09b}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header>
<div class="orn">✦ ✦ ✦</div>
<h1 id="biz-name">…</h1>
<div class="rule"></div>
<div class="tag" id="biz-tag"></div>
</header>
<div class="contact">
<div class="addr" id="biz-addr"></div>
<a class="call" id="biz-phone" href="#" style="display:none">Call</a>
<a class="dir" id="biz-dir" href="#">Directions</a>
<a class="fb" id="fb-link" href="#">Facebook</a>
</div>
<main id="content"><div class="loading">Loading…</div></main>
<footer><span id="foot-name"></span><br><span id="foot-addr"></span></footer>
<script>

fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.title = b.name + ' — ' + c.meta.townTrade;
    set('biz-name', b.name); set('biz-tag', b.tagline);
    set('biz-addr', b.address);
    const ph = document.getElementById('biz-phone');
    if (b.phone) { ph.textContent = b.phone; ph.href = 'tel:+1' + b.phone.replace(/\D/g, ''); ph.style.display = ''; }
    const dl = document.getElementById('biz-dir');
    if (dl && b.address) dl.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.name + ' ' + b.address);
    const fb = document.getElementById('fb-link');
    if (fb && b.facebook) { fb.href = b.facebook; fb.style.display = ''; }
    const an = document.getElementById('banner');
    if (c.announcement) { an.textContent = c.announcement; an.style.display = 'block'; }
    let h = '';
    if (c.specials && c.specials.length) {
      h += '<section class="block"><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b>' + (s.desc ? '<span>' + esc(s.desc) + '</span>' : '') + '</div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section class="block"><h2>' + esc(sec.section) + '</h2>' +
        (sec.items || []).map(it =>
          '<div class="item"><div class="n">' + esc(it.name) +
          (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</div>' +
          (it.price ? '<div class="p">' + esc(it.price) + '</div>' : '') + '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section class="block"><h2>Hours</h2><div class="hours">' + c.hours.map(x =>
        '<div class="hrow"><span>' + esc(x.days) + '</span><span>' + esc(x.time) + '</span></div>').join('') + '</div></section>';
    }
    document.getElementById('content').innerHTML = h;
    document.getElementById('foot-name').textContent = b.name || '';
    document.getElementById('foot-addr').textContent = b.address || '';
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function set(id, v) { const e = document.getElementById(id); if (e && v) e.textContent = v; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

</script>
</body>
</html>
