<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatt Matt's Tatts | Tattoo Shop in Logansport, IN</title>
<meta name="description" content="Fatt Matt's Tatts — the cover-up specialist in Logansport, IN. 21 years of tattooing. Appointment only. Call (574) 230-3535.">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Courier New", Courier, monospace; line-height: 1.65; color: #f5efe4; background: #191410; }
.banner { display: none; text-align: center; padding: 0.8rem 1rem; font-weight: 700; background: #ffcf3f; color: #191410; }
.hero { text-align: center; padding: 3rem 1.2rem 2.2rem; background: repeating-linear-gradient(-45deg, #191410 0 26px, #1e1813 26px 52px); border-top: 10px solid #ff7a1a; border-bottom: 10px solid #ff7a1a; }
.hero h1 { font-family: "Arial Black", Impact, sans-serif; font-size: clamp(2.1rem, 8vw, 3.2rem); color: #ffcf3f; line-height: 1.15; margin: 0.6rem 0 0.4rem; }
.tag { font-size: 1.08rem; color: #ff9d5c; font-weight: 700; letter-spacing: 0.02em; }
.contact-bar { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; padding: 0 1.2rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; min-width: 160px; padding: 0.7rem 1.4rem; font-size: 1.05rem; font-weight: 700; text-decoration: none; border-radius: 0; .btn.call { background: #ff7a1a; color: #191410; border: 3px solid #ffcf3f; font-family: "Arial Black", Impact, sans-serif; } .btn.dir { background: transparent; color: #ffcf3f; border: 3px solid #ff7a1a; font-family: "Arial Black", Impact, sans-serif; } }
.addr { text-align: center; padding: 0.9rem 1.2rem 0.4rem; color: #d8cdb8; font-size: 0.98rem; }
main { max-width: 760px; margin: 0 auto; padding: 1.6rem 1.2rem 3rem; }
section { margin-bottom: 2.4rem; }
section h2 { font-family: "Arial Black", Impact, sans-serif; font-size: 1.5rem; color: #ff7a1a; margin-bottom: 0.9rem; text-transform: uppercase; background: #241d15; padding: 0.4rem 0.8rem; border-left: 8px solid #ffcf3f; }
.special { background: #241d15; border: 2px dashed #ffcf3f; padding: 0.85rem 1rem; margin-bottom: 0.8rem; color: #f5efe4; }
.special b { display: block; font-size: 1.05rem; }
.special span { font-size: 0.96rem; }
.item { display: flex; justify-content: space-between; gap: 1rem; padding: 0.65rem 0; border-bottom: 2px solid #2e2519; }
.item .n { font-weight: 700; font-size: 1.02rem; }
.item .n small { display: block; font-weight: 400; font-size: 0.9rem; color: #cbbb9c; margin-top: 0.15rem; }
.item .p { font-weight: 700; white-space: nowrap; color: #ffcf3f; }
.hours { width: 100%; border-collapse: collapse; }
.hours td { padding: 0.55rem 0; border-bottom: 1px dotted #2e2519; }
.hours td:last-child { text-align: right; font-weight: 700; }
footer { text-align: center; padding: 1.6rem 1.2rem 2.2rem; font-size: 0.88rem; color: #8a7a5f; border-top: 6px solid #ff7a1a; }
.loading { text-align: center; padding: 4rem 1rem; }
.badge-row { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 0.9rem; }
.badge { display: inline-block; padding: 0.35rem 0.9rem; font-size: 0.85rem; font-weight: 700; border-radius: 999px; background: #ff7a1a; color: #191410; text-transform: uppercase; }
.fb-link { display: inline-block; margin-top: 0.7rem; font-weight: 700; color: #ffcf3f; }
.deco { margin-bottom: 0.4rem; }
a:focus-visible, .btn:focus-visible { outline: 3px solid #ff7a1a; outline-offset: 2px; }

</style>
</head>
<body>
<div class="banner" id="banner" role="note"></div>
<header class="hero">
  <svg class="deco" width="140" height="30" viewBox="0 0 140 30" aria-hidden="true"><g><rect x="0" y="0" width="20" height="30" fill="#ff7a1a" transform="skewX(-20) translate(-0.0,0)"/><rect x="40" y="0" width="20" height="30" fill="#ff7a1a" transform="skewX(-20) translate(-0.0,0)"/><rect x="80" y="0" width="20" height="30" fill="#ff7a1a" transform="skewX(-20) translate(-0.0,0)"/><rect x="120" y="0" width="20" height="30" fill="#ff7a1a" transform="skewX(-20) translate(-0.0,0)"/></g><rect x="0" y="0" width="140" height="30" fill="none"/></svg>
  <h1 id="biz-name">&hellip;</h1>
  <p class="tag" id="biz-tag"></p>
  <div class="badge-row"><span class="badge">The cover-up specialist</span><span class="badge">21 years of tattooing</span><span class="badge">4.8 stars on Google</span></div>
</header>
<div class="contact-bar">
  <a class="btn call" id="biz-phone" href="#">Call</a>
  <a class="btn dir" id="biz-dir" href="#" target="_blank" rel="noopener">Get Directions</a>
</div>
<p class="addr" id="biz-addr"></p>

<main id="content"><div class="loading">Loading&hellip;</div></main>
<footer>
  <p id="foot-name"></p>
  <p>Content managed with SiteKeeper.</p>
</footer>
<script>
fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    document.title = c.business.name + ' | ' + (c.business.tagline || '');
    document.getElementById('biz-name').textContent = c.business.name;
    document.getElementById('biz-tag').textContent = c.business.tagline || '';
    document.getElementById('biz-addr').textContent = c.business.address || '';
    document.getElementById('foot-name').textContent = c.business.name + ' — ' + (c.business.address || '');
    var ph = document.getElementById('biz-phone');
    ph.textContent = 'Call ' + (c.business.phone || '');
    ph.href = 'tel:' + (c.business.phone || '').replace(/\D/g, '');
    document.getElementById('biz-dir').href =
      'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.business.address || '');
    if (c.announcement) {
      var b = document.getElementById('banner');
      b.textContent = c.announcement;
      b.style.display = 'block';
    }
    var h = '';
    if (c.specials && c.specials.length) {
      h += '<section aria-label="Specials"><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b><span>' + esc(s.desc) + '</span></div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section><h2>' + esc(sec.section) + '</h2>' + (sec.items || []).map(it =>
        '<div class="item"><div class="n">' + esc(it.name) +
        (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') +
        '</div>' + (it.price ? '<div class="p">' + esc(it.price) + '</div>' : '') + '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section><h2>Hours</h2><table class="hours"><tbody>' + c.hours.map(x =>
        '<tr><td>' + esc(x.days) + '</td><td>' + esc(x.time) + '</td></tr>').join('') + '</tbody></table></section>';
    }
    document.getElementById('content').innerHTML = h;
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
