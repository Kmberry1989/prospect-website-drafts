<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<link rel="icon" href="data:,">
<title>East End Muffler — Peru, IN | Exhaust, Brakes &amp; Auto Repair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,600;0,700;1,600;1,700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --char: #1c1c1e;
    --char2: #262628;
    --red: #e0352b;
    --red-deep: #a92319;
    --paper: #faf8f5;
    --ink: #211f1e;
    --muted: #6f6a65;
    --line: #e4ded6;
  }
  body { font-family: "Barlow", system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.58; font-size: 17px; }
  a { color: inherit; }
  .banner { background: var(--red); color: #fff; text-align: center; padding: 0.75rem 1rem; font-weight: 700; display: none; }
  header { background: var(--char); color: #fff; padding: 0 0 2.4rem; text-align: center; }
  header .stripe { height: 10px; background: linear-gradient(90deg, var(--red) 0 30%, transparent 30% 32%, var(--red) 32% 62%, transparent 62% 64%, var(--red) 64% 100%); margin-bottom: 2.2rem; }
  header .kicker { font-family: "Barlow Condensed", sans-serif; font-style: italic; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--red); font-size: 0.95rem; margin-bottom: 0.6rem; }
  header h1 { font-family: "Archivo Black", sans-serif; font-size: clamp(2rem, 8.5vw, 3.2rem); line-height: 1.04; text-transform: uppercase; padding: 0 1rem; }
  header h1 em { font-style: normal; color: var(--red); }
  header .tag { margin-top: 0.8rem; color: #c9c4bd; font-size: 1.05rem; font-style: italic; }
  .cta { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; padding: 1.6rem 1.25rem 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 58px; padding: 0.85rem 1.7rem; font-family: "Barlow Condensed", sans-serif; font-style: italic; font-weight: 700; font-size: 1.3rem; letter-spacing: 0.04em; text-transform: uppercase; text-decoration: none; border-radius: 999px; }
  .btn.primary { background: var(--red); color: #fff; box-shadow: 0 10px 24px rgba(224,53,43,.35); }
  .btn.alt { background: transparent; color: var(--char); border: 3px solid var(--char); }
  .btn:active { transform: scale(.98); }
  main { max-width: 740px; margin: 0 auto; padding: 1.8rem 1.25rem 2.5rem; }
  section { margin-bottom: 2.4rem; }
  h2 { font-family: "Archivo Black", sans-serif; font-size: 1.5rem; text-transform: uppercase; margin-bottom: 1rem; }
  h2 em { font-style: normal; color: var(--red); }
  .special { background: #fff; border: 2px solid var(--red); border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 0.9rem; }
  .special b { display: block; font-family: "Barlow Condensed", sans-serif; font-style: italic; font-weight: 700; font-size: 1.3rem; text-transform: uppercase; }
  .special span { color: var(--muted); font-size: 0.95rem; }
  .svc { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0.95rem 1.1rem; margin-bottom: 0.7rem; border-top: 4px solid var(--red); }
  .svc .n { font-weight: 700; font-size: 1.08rem; }
  .svc .n small { display: block; font-weight: 400; color: var(--muted); font-size: 0.9rem; }
  .hours { width: 100%; border-collapse: collapse; }
  .hours td { padding: 0.7rem 0.2rem; border-bottom: 2px solid var(--line); font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 1.15rem; letter-spacing: 0.02em; }
  .hours tr:last-child td { border-bottom: none; }
  .hours td:last-child { text-align: right; color: var(--red-deep); font-style: italic; }
  .visit { background: var(--char); color: #e8e2da; border-radius: 14px; padding: 1.4rem; }
  .visit p { margin-bottom: 0.5rem; color: #b9b2a8; }
  .visit a { color: var(--red); font-weight: 700; }
  footer { text-align: center; padding: 1.4rem 1rem 2.4rem; color: var(--muted); font-size: 0.85rem; }
  .loading { text-align: center; padding: 4rem 1rem; color: var(--muted); }
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header>
  <div class="stripe" aria-hidden="true"></div>
  <div class="kicker">Peru, Indiana</div>
  <h1 id="biz-name">…</h1>
  <p class="tag" id="biz-tag"></p>
</header>
<div class="cta">
  <a class="btn primary" id="call-btn" href="#">Call the Shop</a>
  <a class="btn alt" id="dir-btn" href="#" target="_blank" rel="noopener">Directions</a>
</div>
<main id="content"><div class="loading">Loading…</div></main>
<footer><span id="foot-name"></span> · Content managed with SiteKeeper.</footer>
<script>
fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.title = b.name + ' — Peru, IN | Exhaust, Brakes & Auto Repair';
    const words = String(b.name || '').split(' ');
    document.getElementById('biz-name').innerHTML =
      esc(words.slice(0, -1).join(' ')) + ' <em>' + esc(words.slice(-1).join(' ')) + '</em>';
    document.getElementById('biz-tag').textContent = b.tagline || '';
    document.getElementById('foot-name').textContent = b.name || '';
    const banner = document.getElementById('banner');
    if (c.announcement) { banner.textContent = c.announcement; banner.style.display = 'block'; }
    const tel = 'tel:' + String(b.phone || '').replace(/\D/g, '');
    const callBtn = document.getElementById('call-btn');
    callBtn.href = tel;
    callBtn.textContent = b.phone || 'Call the Shop';
    const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.address || b.name);
    document.getElementById('dir-btn').href = mapsUrl;
    let h = '';
    if (c.specials && c.specials.length) {
      h += '<section><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b><span>' + esc(s.desc) + '</span></div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section><h2><em>' + esc(sec.section) + '</em></h2>' + (sec.items || []).map(it =>
        '<div class="svc"><div class="n">' + esc(it.name) +
        (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</div></div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section><h2>Hours</h2><table class="hours">' + c.hours.map(x =>
        '<tr><td>' + esc(x.days) + '</td><td>' + esc(x.time) + '</td></tr>').join('') + '</table></section>';
    }
    h += '<section><h2>Find Us</h2><div class="visit"><p>' + esc(b.address || '') + '</p>' +
      '<p>Phone: <a href="' + tel + '">' + esc(b.phone || '') + '</a></p>' +
      '<p><a href="' + mapsUrl + '" target="_blank" rel="noopener">Open in Google Maps &#8599;</a></p></div></section>';
    document.getElementById('content').innerHTML = h;
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
