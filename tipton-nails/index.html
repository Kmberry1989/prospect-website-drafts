<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipton Nails — Tipton, IN — Nail Salon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4faf8;color:#2a3d38;line-height:1.6}
.banner{display:none;border-top:2px solid #146c60;border-bottom:2px solid #146c60;text-align:center;padding:.8rem 1rem;font-weight:700;color:#0f5c52}
.wrap{max-width:640px;margin:0 auto;padding:0 1.4rem}
header{padding:3rem 0 1.6rem}
.mono{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:#146c60;margin-bottom:.8rem}
h1{font-size:clamp(2rem,7vw,2.9rem);font-weight:800;color:#0f5c52;line-height:1.1;letter-spacing:-.01em}
.tag{color:#758a84;margin-top:.5rem;font-size:1.05rem}
.meta{padding:1.2rem 0 1.6rem;border-top:1px solid #d9e8e3;margin-top:1.6rem}
.meta .addr{color:#758a84;margin-bottom:1rem}
.btns{display:flex;gap:.6rem;flex-wrap:wrap}
.btns a{min-height:48px;display:inline-flex;align-items:center;padding:.6rem 1.3rem;text-decoration:none;font-weight:700;border-radius:4px}
.btns .call{background:#0f5c52;color:#f4faf8}
.btns .dir{background:transparent;border:2px solid #0f5c52;color:#0f5c52}
.btns .fb{background:transparent;border:2px solid #d9e8e3;color:#758a84;display:none}
main{padding-bottom:3rem}
.block{margin:2.6rem 0}
h2{font-size:.82rem;font-family:'SF Mono',Menlo,Consolas,monospace;letter-spacing:.22em;text-transform:uppercase;color:#146c60;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:2px solid #0f5c52}
.special{padding:.9rem 0;border-bottom:1px solid #d9e8e3}
.special b{display:block;font-size:1.05rem;color:#0f5c52}
.special span{color:#758a84;font-size:.94rem}
.item{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0;border-bottom:1px solid #d9e8e3}
.item .n{font-weight:600;color:#0f5c52}
.item .n small{display:block;font-weight:400;color:#758a84;font-size:.86rem}
.item .p{font-weight:700;color:#146c60;white-space:nowrap}
.hrow{display:flex;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid #d9e8e3}
.hrow span:last-child{font-weight:700;color:#0f5c52}
footer{border-top:1px solid #d9e8e3;padding:1.6rem 0;color:#758a84;font-size:.85rem}
.loading{text-align:center;padding:4rem 1rem;color:#758a84}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<div class="wrap">
<header>
<div class="mono">Nail Studio</div>
<h1 id="biz-name">…</h1>
<div class="tag" id="biz-tag"></div>
</header>
<div class="meta">
<div class="addr" id="biz-addr"></div>
<div class="btns">
<a class="call" id="biz-phone" href="#" style="display:none">Call</a>
<a class="dir" id="biz-dir" href="#">Directions</a>
<a class="fb" id="fb-link" href="#">Facebook</a>
</div>
</div>
<main id="content"><div class="loading">Loading…</div></main>
<footer><span id="foot-name"></span><br><span id="foot-addr"></span></footer>
</div>
<script>

fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.title = b.name + ' — ' + c.meta.townTrade;
    set('biz-name', b.name); set('biz-tag', b.tagline);
    set('biz-addr', b.address);
    const ph = document.getElementById('biz-phone');
    if (b.phone) { ph.textContent = b.phone; ph.href = 'tel:+1' + b.phone.replace(/\D/g, ''); ph.style.display = ''; }
    const dl = document.getElementById('biz-dir');
    if (dl && b.address) dl.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.name + ' ' + b.address);
    const fb = document.getElementById('fb-link');
    if (fb && b.facebook) { fb.href = b.facebook; fb.style.display = ''; }
    const an = document.getElementById('banner');
    if (c.announcement) { an.textContent = c.announcement; an.style.display = 'block'; }
    let h = '';
    if (c.specials && c.specials.length) {
      h += '<section class="block"><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b>' + (s.desc ? '<span>' + esc(s.desc) + '</span>' : '') + '</div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section class="block"><h2>' + esc(sec.section) + '</h2>' +
        (sec.items || []).map(it =>
          '<div class="item"><div class="n">' + esc(it.name) +
          (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</div>' +
          (it.price ? '<div class="p">' + esc(it.price) + '</div>' : '') + '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section class="block"><h2>Hours</h2><div class="hours">' + c.hours.map(x =>
        '<div class="hrow"><span>' + esc(x.days) + '</span><span>' + esc(x.time) + '</span></div>').join('') + '</div></section>';
    }
    document.getElementById('content').innerHTML = h;
    document.getElementById('foot-name').textContent = b.name || '';
    document.getElementById('foot-addr').textContent = b.address || '';
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function set(id, v) { const e = document.getElementById(id); if (e && v) e.textContent = v; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

</script>
</body>
</html>
