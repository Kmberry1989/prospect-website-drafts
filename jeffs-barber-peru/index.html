<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeff's Barber Shop — Peru, IN — Barber Shop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:#f6f2e9;color:#2d2a24;line-height:1.65}
.pole{height:14px;background:repeating-linear-gradient(45deg,#1f3d2b 0 18px,#f6f2e9 18px 36px,#a31621 36px 54px)}
.banner{display:none;background:#8a6d1f;color:#f6f2e9;text-align:center;padding:.8rem 1rem;font-weight:700}
header{text-align:center;padding:2.6rem 1.2rem 1.4rem}
header .kicker{letter-spacing:.35em;font-size:.72rem;color:#8a6d1f;text-transform:uppercase;margin-bottom:.6rem}
h1{font-size:clamp(2rem,7vw,3rem);color:#1f3d2b;line-height:1.15}
.tag{font-style:italic;color:#6f6a5b;margin-top:.5rem;font-size:1.05rem}
.actions{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;padding:1.2rem 1.2rem 2rem}
.btn{display:inline-block;min-height:48px;line-height:48px;padding:0 1.4rem;border-radius:6px;font-weight:700;text-decoration:none;font-size:1rem}
.btn.call{background:#8a6d1f;color:#f6f2e9}
.btn.ghost{border:2px solid #8a6d1f;color:#8a6d1f;background:transparent}
.btn.fb{border:2px solid #6f6a5b;color:#6f6a5b;background:transparent;display:none}
main{max-width:700px;margin:0 auto;padding:0 1.2rem 3rem}
.block{background:#fffdf6;border:1px solid #ddd3b8;border-radius:10px;padding:1.4rem;margin-bottom:1.6rem;box-shadow:0 2px 8px rgba(0,0,0,.12)}
h2{color:#1f3d2b;font-size:1.25rem;letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid #8a6d1f;padding-bottom:.35rem;margin-bottom:1rem}
.special{border-left:4px solid #8a6d1f;padding:.7rem 1rem;margin-bottom:.8rem;background:#f6f2e9;border-radius:0 8px 8px 0}
.special b{display:block;font-size:1.05rem}
.special span{color:#6f6a5b;font-size:.95rem}
.item{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px dotted #ddd3b8}
.item .n{font-weight:700}
.item .n small{display:block;font-weight:400;color:#6f6a5b;font-size:.86rem}
.item .p{font-weight:700;color:#8a6d1f;white-space:nowrap}
.hours .hrow{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px dotted #ddd3b8}
.hours .hrow span:last-child{font-weight:700}
.info{text-align:center;padding:0 1.2rem 1rem;color:#6f6a5b}
footer{text-align:center;padding:1.6rem;color:#6f6a5b;font-size:.85rem;border-top:1px solid #ddd3b8}
.loading{text-align:center;padding:4rem 1rem;color:#6f6a5b}
</style>
</head>
<body>
<div class="pole"></div>
<div class="banner" id="banner"></div>
<header>
<div class="kicker" id="kicker">Barber Shop</div>
<h1 id="biz-name">…</h1>
<div class="tag" id="biz-tag"></div>
</header>
<div class="info"><span id="biz-addr"></span></div>
<div class="actions">
<a class="btn call" id="biz-phone" href="#" style="display:none">Call</a>
<a class="btn ghost" id="biz-dir" href="#">Get Directions</a>
<a class="btn fb" id="fb-link" href="#">Facebook</a>
</div>
<main id="content"><div class="loading">Loading…</div></main>
<div class="pole"></div>
<footer><span id="foot-name"></span><br><span id="foot-addr"></span></footer>
<script>

fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.title = b.name + ' — ' + c.meta.townTrade;
    set('biz-name', b.name); set('biz-tag', b.tagline);
    set('biz-addr', b.address);
    const ph = document.getElementById('biz-phone');
    if (b.phone) { ph.textContent = b.phone; ph.href = 'tel:+1' + b.phone.replace(/\D/g, ''); ph.style.display = ''; }
    const dl = document.getElementById('biz-dir');
    if (dl && b.address) dl.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.name + ' ' + b.address);
    const fb = document.getElementById('fb-link');
    if (fb && b.facebook) { fb.href = b.facebook; fb.style.display = ''; }
    const an = document.getElementById('banner');
    if (c.announcement) { an.textContent = c.announcement; an.style.display = 'block'; }
    let h = '';
    if (c.specials && c.specials.length) {
      h += '<section class="block"><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b>' + (s.desc ? '<span>' + esc(s.desc) + '</span>' : '') + '</div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section class="block"><h2>' + esc(sec.section) + '</h2>' +
        (sec.items || []).map(it =>
          '<div class="item"><div class="n">' + esc(it.name) +
          (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</div>' +
          (it.price ? '<div class="p">' + esc(it.price) + '</div>' : '') + '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section class="block"><h2>Hours</h2><div class="hours">' + c.hours.map(x =>
        '<div class="hrow"><span>' + esc(x.days) + '</span><span>' + esc(x.time) + '</span></div>').join('') + '</div></section>';
    }
    document.getElementById('content').innerHTML = h;
    document.getElementById('foot-name').textContent = b.name || '';
    document.getElementById('foot-addr').textContent = b.address || '';
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function set(id, v) { const e = document.getElementById(id); if (e && v) e.textContent = v; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

</script>
</body>
</html>
