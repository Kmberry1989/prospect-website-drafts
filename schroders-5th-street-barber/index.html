<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schroder's 5th Street Barber — Logansport, IN — Barber Shop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:#f7f2e8;color:#33291f;line-height:1.65}
.banner{display:none;background:#2f3b2e;color:#f7f2e8;text-align:center;padding:.75rem 1rem;font-weight:700}
.band{background:#5c1f24;color:#f7f2e8;padding:2.6rem 1.2rem 2rem;text-align:center}
.band h1{font-size:clamp(2rem,7vw,3rem);line-height:1.12}
.band .est{letter-spacing:.3em;font-size:.72rem;text-transform:uppercase;opacity:.85;margin-bottom:.7rem}
.band .tag{font-style:italic;margin-top:.6rem;font-size:1.08rem;opacity:.95;max-width:560px;margin-left:auto;margin-right:auto}
.strap{background:#5c1f24;height:8px}
.contactbar{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;padding:1.4rem 1.2rem;background:#fffdf7;border-bottom:1px solid #e0d4ba}
.contactbar a{min-height:48px;display:inline-flex;align-items:center;padding:.6rem 1.3rem;border-radius:6px;font-weight:700;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.contactbar .call{background:#5c1f24;color:#f7f2e8}
.contactbar .dir{border:2px solid #5c1f24;color:#5c1f24}
.contactbar .fb{border:2px solid #7a6c58;color:#7a6c58;display:none}
.addr{text-align:center;color:#7a6c58;padding:1rem 1.2rem 0}
main{max-width:700px;margin:0 auto;padding:2rem 1.2rem 3rem}
.block{margin-bottom:2.4rem}
h2{color:#5c1f24;font-size:1.35rem;margin-bottom:.8rem}
h2 .no{color:#5c1f24;margin-right:.5rem}
.special{border:2px dashed #5c1f24;border-radius:8px;padding:1rem 1.1rem;margin-bottom:.8rem;background:#fffdf7}
.special b{display:block;font-size:1.05rem}
.special span{color:#7a6c58;font-size:.95rem}
.item{padding:.6rem 0;border-bottom:1px solid #e0d4ba;display:flex;justify-content:space-between;gap:1rem}
.item .n{font-weight:700}
.item .n small{display:block;font-weight:400;color:#7a6c58;font-size:.87rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.item .p{font-weight:700;color:#5c1f24;white-space:nowrap}
.hours{border-top:3px solid #5c1f24}
.hrow{display:flex;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid #e0d4ba}
.hrow span:last-child{font-weight:700}
footer{text-align:center;padding:1.6rem;color:#7a6c58;font-size:.85rem;border-top:1px solid #e0d4ba}
.loading{text-align:center;padding:4rem 1rem;color:#7a6c58}

.biz-logo{display:block;margin:0 auto .7rem;max-height:104px;width:auto;max-width:72%;border-radius:10px}
.hero-photo{display:block;margin:0 auto 1rem;max-height:230px;width:auto;max-width:88%;border-radius:12px}
.photos{max-width:760px;margin:0 auto 2.4rem;padding:0 1.2rem}
.photos h2{font-size:1.35rem;margin-bottom:.8rem}
.photo-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
.photo-strip img{width:100%;height:165px;object-fit:cover;border-radius:10px;display:block}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<div class="band">
<img class="biz-logo" src="../assets/schroders-5th-street-barber/schroders-5th-street-barber-profile.jpg" alt="Schroder's 5th Street Barber logo">

<div class="est">Logansport · Indiana</div>
<h1 id="biz-name">…</h1>
<div class="tag" id="biz-tag"></div>
</div>
<div class="strap"></div>
<div class="addr" id="biz-addr"></div>
<div class="contactbar">
<a class="call" id="biz-phone" href="#" style="display:none">Call</a>
<a class="dir" id="biz-dir" href="#">Get Directions</a>
<a class="fb" id="fb-link" href="#">Facebook</a>
</div>
<main id="content"><div class="loading">Loading…</div></main>

<section class="photos" aria-label="The craft">
<h2>The craft</h2>
<div class="photo-strip">
<img src="../assets/schroders-5th-street-barber/schroders-5th-street-barber-1.jpg" alt="Barber work at Schroder’s 5th Street Barber" loading="lazy"><img src="../assets/schroders-5th-street-barber/schroders-5th-street-barber-2.jpg" alt="A fresh cut at Schroder’s" loading="lazy"><img src="../assets/schroders-5th-street-barber/schroders-5th-street-barber-3.jpg" alt="In the chair at Schroder’s 5th Street Barber" loading="lazy">
</div>
</section>
<footer><span id="foot-name"></span><br><span id="foot-addr"></span></footer>
<script>

fetch('content.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(c => {
    const b = c.business || {};
    document.title = b.name + ' — ' + c.meta.townTrade;
    set('biz-name', b.name); set('biz-tag', b.tagline);
    set('biz-addr', b.address);
    const ph = document.getElementById('biz-phone');
    if (b.phone) { ph.textContent = b.phone; ph.href = 'tel:+1' + b.phone.replace(/\D/g, ''); ph.style.display = ''; }
    const dl = document.getElementById('biz-dir');
    if (dl && b.address) dl.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.name + ' ' + b.address);
    const fb = document.getElementById('fb-link');
    if (fb && b.facebook) { fb.href = b.facebook; fb.style.display = ''; }
    const an = document.getElementById('banner');
    if (c.announcement) { an.textContent = c.announcement; an.style.display = 'block'; }
    let h = '';
    if (c.specials && c.specials.length) {
      h += '<section class="block"><h2>Specials</h2>' + c.specials.map(s =>
        '<div class="special"><b>' + esc(s.title) + '</b>' + (s.desc ? '<span>' + esc(s.desc) + '</span>' : '') + '</div>').join('') + '</section>';
    }
    (c.menu || []).forEach(sec => {
      h += '<section class="block"><h2>' + esc(sec.section) + '</h2>' +
        (sec.items || []).map(it =>
          '<div class="item"><div class="n">' + esc(it.name) +
          (it.desc ? '<small>' + esc(it.desc) + '</small>' : '') + '</div>' +
          (it.price ? '<div class="p">' + esc(it.price) + '</div>' : '') + '</div>').join('') + '</section>';
    });
    if (c.hours && c.hours.length) {
      h += '<section class="block"><h2>Hours</h2><div class="hours">' + c.hours.map(x =>
        '<div class="hrow"><span>' + esc(x.days) + '</span><span>' + esc(x.time) + '</span></div>').join('') + '</div></section>';
    }
    document.getElementById('content').innerHTML = h;
    document.getElementById('foot-name').textContent = b.name || '';
    document.getElementById('foot-addr').textContent = b.address || '';
  })
  .catch(() => { document.getElementById('content').innerHTML = '<div class="loading">Could not load content.</div>'; });
function set(id, v) { const e = document.getElementById(id); if (e && v) e.textContent = v; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

</script>
</body>
</html>
